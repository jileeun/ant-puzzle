const shadeMemo = {};
function shade(hex, amt) {
  const key = hex + amt;
  if (shadeMemo[key]) return shadeMemo[key];
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return (shadeMemo[key] = `rgb(${r|0},${g|0},${b|0})`);
}
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ================== 그림 처리: 확대 + 사물 테두리 + 바깥 테두리 ==================
const MAX_C = 36, MAX_R = 30;   // 테두리 포함 최대 칸 수 (약 1000피스)
function parseArt(art) {
  const rows = art.length, cols = Math.max(...art.map(s => s.length));
  const g = [];
  for (let r = 0; r < rows; r++) {
    g.push([]);
    for (let c = 0; c < cols; c++) {
      const ch = art[r][c] || '.';
      g[r].push(ch === '.' || ch === ' ' ? null : ch);
    }
  }
  return g;
}
function addOutline(base) {
  const R0 = base.length, C0 = base[0].length;
  const g = Array.from({ length: R0 + 2 }, () => Array(C0 + 2).fill(null));
  for (let r = 0; r < R0; r++) for (let c = 0; c < C0; c++) g[r + 1][c + 1] = base[r][c];
  const out = g.map(r => r.slice());
  for (let r = 0; r < g.length; r++) for (let c = 0; c < g[0].length; c++) {
    if (g[r][c]) continue;
    let near = false;
    for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < g.length && nc < g[0].length && g[nr][nc]) { near = true; break; }
    }
    if (near) out[r][c] = 'D';
  }
  return out;
}
// 그림 속 사물 사이에 검은 선: 서로 다른 색의 큰 덩어리가 맞닿은 곳에 1칸 선을 넣는다
// (눈·창문 같은 작은 덩어리는 그대로 둔다)
const LINE_MIN = 24;
function addInnerLines(g) {
  const R = g.length, C = g[0].length;
  const id = g.map(r => r.map(() => -1)), size = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (!g[r][c] || id[r][c] >= 0) continue;
    const k = size.length, col = g[r][c], st = [[r, c]];
    id[r][c] = k; let n = 0;
    while (st.length) {
      const [y, x] = st.pop(); n++;
      for (const [dr, dc] of D4) {
        const ny = y + dr, nx = x + dc;
        if (ny < 0 || nx < 0 || ny >= R || nx >= C || id[ny][nx] >= 0 || g[ny][nx] !== col) continue;
        id[ny][nx] = k; st.push([ny, nx]);
      }
    }
    size.push(n);
  }
  const mark = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const v = g[r][c];
    if (!v || v === 'D') continue;
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= R || nc >= C) continue;
      const n = g[nr][nc];
      if (!n || n === 'D' || n === v) continue;
      const a = size[id[r][c]], b = size[id[nr][nc]];
      if (a < LINE_MIN || b < LINE_MIN) continue;
      mark.push(a >= b ? [r, c] : [nr, nc]);
    }
  }
  const out = g.map(r => r.slice());
  for (const [r, c] of mark) out[r][c] = 'D';
  return out;
}
function processPixel(art) {
  const base = parseArt(art);
  const R0 = base.length, C0 = base[0].length;
  const s = Math.min((MAX_C - 2) / C0, (MAX_R - 2) / R0);
  const Rn = Math.round(R0 * s), Cn = Math.round(C0 * s);
  const g = [];
  for (let r = 0; r < Rn; r++) {
    g.push([]);
    for (let c = 0; c < Cn; c++) g[r].push(base[Math.min(R0 - 1, Math.floor((r + 0.5) * R0 / Rn))][Math.min(C0 - 1, Math.floor((c + 0.5) * C0 / Cn))]);
  }
  return addOutline(addInnerLines(g));
}
// ow > 0 이면 큰 도형마다 검은 외곽선을 그린다 (고해상도 클리어 그림용)
function makePainter(g, used, ow = 0) {
  const col = k => { used.add(k); return COLORS[k]; };
  const path = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  const edge = big => { if (ow && big) { g.lineWidth = ow; g.strokeStyle = COLORS.D; g.lineJoin = 'round'; g.stroke(); } };
  return {
    bg(k) { g.fillStyle = col(k); g.fillRect(-50, -50, 2000, 2000); },
    // outline=false: 체크무늬 같은 바탕 무늬는 테두리 없이
    rect(x, y, w, h, k, outline = true) { g.fillStyle = col(k); g.beginPath(); g.rect(x, y, w, h); g.fill(); edge(outline && Math.min(w, h) >= 20 && w < 390); },
    circ(x, y, r, k) { g.fillStyle = col(k); g.beginPath(); g.arc(x, y, r, 0, PI * 2); g.fill(); edge(r >= 12); },
    ell(x, y, rx, ry, k, rot = 0) { g.fillStyle = col(k); g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, PI * 2); g.fill(); edge(Math.min(rx, ry) >= 10); },
    poly(pts, k) {
      g.fillStyle = col(k); path(pts); g.closePath(); g.fill();
      const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
      edge(Math.min(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) >= 20);
    },
    line(pts, k, w) { g.strokeStyle = col(k); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; path(pts); g.stroke(); },
    curve(pts, k, w) {
      g.strokeStyle = col(k); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }

function photoToGrid(img) {
  const asp = img.width / img.height;
  let Cn = MAX_C - 2, Rn = Math.round(Cn / asp);
  if (Rn > MAX_R - 2) { Rn = MAX_R - 2; Cn = Math.max(4, Math.round(Rn * asp)); }

  const data = g.getImageData(0, 0, Cn, Rn).data;
  const keys = Object.keys(COLORS);
  const pal = keys.map(k => [k, hexRgb(COLORS[k])]);
  const nearest = (r, gg, b, list) => {
    let best = list[0][0], bd = 1e9;
    for (const [k, [pr, pg, pb]] of list) {
      const d = 2 * (r - pr) ** 2 + 4 * (gg - pg) ** 2 + 3 * (b - pb) ** 2;   // 사람 눈에 가까운 가중치
      if (d < bd) { bd = d; best = k; }
    }
    return best;
  };
  // 귀여운 느낌을 위해 채도를 살짝 올려서 팔레트에 맞춤
  const px = [];
  for (let i = 0; i < data.length; i += 4) {
    let [r, gg, b] = [data[i], data[i + 1], data[i + 2]];
    const m = (r + gg + b) / 3;
    r = Math.max(0, Math.min(255, m + (r - m) * 1.35));
    gg = Math.max(0, Math.min(255, m + (gg - m) * 1.35));
    b = Math.max(0, Math.min(255, m + (b - m) * 1.35));
    px.push([r, gg, b, data[i + 3]]);
  }
  const first = px.map(([r, gg, b]) => nearest(r, gg, b, pal));
  const cnt = {};
  first.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
  // 넓이가 1% 이상인 색은 작아도 살림 (지붕의 빨강처럼 눈에 띄는 색)
  const minCells = Math.max(6, first.length * 0.008);
  const keep = Object.entries(cnt).sort((a, b) => b[1] - a[1]).filter(([, n], i) => i < 4 || n >= minCells).slice(0, PHOTO_COLORS).map(([k]) => k);
  const palKeep = pal.filter(([k]) => keep.includes(k));
  const out = [];
  for (let r = 0; r < Rn; r++) {
    out.push([]);
    for (let c = 0; c < Cn; c++) {
      const [pr, pg, pb, a] = px[r * Cn + c];
      out[r].push(a < 128 ? null : nearest(pr, pg, pb, palKeep));
    }
  }
  return addOutline(out);   // 사진은 그라데이션이 많아서 안쪽 선 없이 바깥 테두리만
}

// ================== 규칙: 바깥과 이어진 빈 길로 닿는 음식만 가져갈 수 있음 (꺾어서 이동 가능) ==================
function borderSide(r, c, R, C) {
  if (r === 0) return 'T';
  if (r === R - 1) return 'B';
  if (c === 0) return 'L';
  return 'R';
}
// 그림판 가장자리와 이어진 빈칸을 넓이 우선으로 탐색해서
// 각 음식 칸마다 "어디로 들어와서 몇 칸 걸어 오는지" 후보를 만든다
function reachMap(g) {
  const R = g.length, C = g[0].length, N = R * C;
  const dist = new Int16Array(N).fill(-1), par = new Int32Array(N).fill(-1), root = new Int32Array(N).fill(-1);
  const q = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (g[r][c] || !(r === 0 || c === 0 || r === R - 1 || c === C - 1)) continue;
    const k = r * C + c; dist[k] = 0; root[k] = k; q.push(k);
  }
  for (let i = 0; i < q.length; i++) {
    const k = q[i], r = Math.floor(k / C), c = k % C;
    for (const [dr, dc] of D4) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= R || nc >= C || g[nr][nc]) continue;
      const n = nr * C + nc;
      if (dist[n] >= 0) continue;
      dist[n] = dist[k] + 1; par[n] = k; root[n] = root[k]; q.push(n);
    }
  }
  const acc = new Map();
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (!g[r][c]) continue;
    const cands = [];
    if (r === 0) cands.push({ via: -1, side: 'T', steps: 0 });
    if (r === R - 1) cands.push({ via: -1, side: 'B', steps: 0 });
    if (c === 0) cands.push({ via: -1, side: 'L', steps: 0 });
    if (c === C - 1) cands.push({ via: -1, side: 'R', steps: 0 });
    for (const [dr, dc] of D4) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= R || nc >= C || g[nr][nc]) continue;
      const n = nr * C + nc;
      if (dist[n] >= 0) cands.push({ via: n, steps: dist[n] + 1 });
    }
    if (cands.length) acc.set(r * C + c, cands);
  }
  return { acc, dist, par, root, R, C };
}

function buildStage(idx) {
  const st = STAGES[idx], rng = mulberry32(idx * 7919 + 101 + (SEED_FIX[idx] || 0) * 1000003);
  const grid = stageGrid(idx).map(r => r.slice());
  // 실제 플레이를 흉내 내며 쇠똥구리 순서를 만든다:
  // 일하는 칸은 보통 3개, 막히면 최대 5개. 새 쇠똥구리는 "지금 닿을 수 있는 색"으로만 만든다.
  const g = grid.map(r => r.slice());
  const C = g[0].length;
  const remain = {};
  let total = 0;
  g.forEach(r => r.forEach(v => { if (v) { remain[v] = (remain[v] || 0) + 1; total++; } }));
  const avg = Math.max(4, total / st.targetAnts);
  const seq = [], active = [];
  const geo = geometry(g.length, C);
  const homes = [0, 1, 2, 3, 4].map(homePos);
  let info = null;
  const nearest = (list, slot) => {   // 실제 쇠똥구리처럼 집에서 가장 가까운 음식
    let bi = 0, bd = 1e9;
    for (let i = 0; i < list.length; i++) {
      for (const cand of info.acc.get(list[i])) {
        const d = pathCost(geo, info, homes[slot].x, homes[slot].y, list[i], cand);
        if (d < bd) { bd = d; bi = i; }
      }
    }
    return bi;
  };
  const reachable = () => {
    info = reachMap(g);
    const by = {};
    for (const k of info.acc.keys()) { const v = g[Math.floor(k / C)][k % C]; (by[v] = by[v] || []).push(k); }
    return by;
  };
  const freeSlot = () => [0, 1, 2, 3, 4].find(s => !active.some(x => x.slot === s));
  const addAnt = by => {
    const colors = Object.keys(by).filter(col => !active.some(x => x.a.color === col));
    if (!colors.length) return false;
    let sum = 0; colors.forEach(col => sum += by[col].length);
    let pick = rng() * sum, color = colors[0];
    for (const col of colors) { pick -= by[col].length; if (pick <= 0) { color = col; break; } }
    let size = Math.round(avg * (0.6 + rng() * 0.8));
    size = Math.min(size, Math.max(6, Math.round(by[color].length * 2.5)), remain[color]);
    if (remain[color] - size < 3) size = remain[color];
    const a = { color, total: size, group: null };
    remain[color] -= size;
    seq.push(a); active.push({ a, left: size, slot: freeSlot() });
    return true;
  };
  while (total > 0) {
    let by = reachable();
    while (active.length < 3 && addAnt(by)) {}
    let progress = false;
    for (const act of active.slice()) {
      const list = by[act.a.color];
      if (!list || !list.length) continue;
      const k = list.splice(nearest(list, act.slot), 1)[0];
      g[Math.floor(k / C)][k % C] = null; total--; act.left--; progress = true;
      if (act.left === 0) active.splice(active.indexOf(act), 1);
    }
    if (!progress) {
      by = reachable();
      if (active.length >= 5 || !addAnt(by)) {
        const act = active.shift();
        act.a.total -= act.left; remain[act.a.color] += act.left;
        if (act.a.total <= 0) seq.splice(seq.indexOf(act.a), 1);
      }
    }
  }
  for (let i = 0; i < seq.length - 1; i++) {
    if (rng() < st.jitter) { [seq[i], seq[i + 1]] = [seq[i + 1], seq[i]]; i++; }
  }
  const cols = [[], [], []];
  for (let i = 0; i < seq.length; i += 3) {
    const chunk = seq.slice(i, i + 3);
    const perm = shuffle([0, 1, 2], rng);
    chunk.forEach((a, k) => cols[perm[k]].push(a));
  }
  // 사슬: 같은 줄의 이웃한 두 마리만 연결 (교착 없음)
  const nRows = Math.ceil(seq.length / 3);
  for (let r = 1; r < nRows; r++) {
    if (rng() >= st.link) continue;
    const opts = [[0, 1], [1, 2]].filter(p => p.every(c => cols[c][r]));
    if (!opts.length) continue;
    const pick = opts[Math.floor(rng() * opts.length)];
    const grp = { members: pick.map(c => cols[c][r]) };
    grp.members.forEach(a => a.group = grp);
  }
  return { grid, cols };
}

const spriteCache = new Map();
function spriteColor(ch, color, name) {
  const b = COLORS[color], dark = color === 'D';

function getSprite(name, color, dir, px, flip = false) {
  const key = name + '|' + color + '|' + dir + '|' + px + '|' + flip;
  let cv = spriteCache.get(key);
  if (cv) return cv;
  const map = SPR[name], h = map.length, w = map[0].length;

  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = map[r][c];
    if (ch === '.') continue;
    let x, y;
    if (dir === 0) { x = c; y = r; }
    else if (dir === 1) { x = h - 1 - r; y = c; }
    else if (dir === 2) { x = w - 1 - c; y = h - 1 - r; }
    else { x = r; y = w - 1 - c; }
    if (flip) x = ow - 1 - x;
    c2.fillStyle = spriteColor(ch, color, name.startsWith('beetle') ? 'beetle' : name);
    c2.fillRect(x * P, y * P, P, P);

  cv.lw = ow * px; cv.lh = oh * px;

  ctx.drawImage(cv, Math.round(cx - cv.lw / 2), Math.round(cy - cv.lh / 2), cv.lw, cv.lh);
  ctx.globalAlpha = 1;
}

function paintBead(c2, x, y, size, ch, rot = 0) {
  const col = COLORS[ch], dark = ch === 'D';
  const pal = {
    o: dark ? '#000000' : shade(col, -0.5),
    b: col,
    h: dark ? '#4a4658' : shade(col, 0.35),
    w: dark ? '#8a8499' : shade(col, 0.75),
    s: dark ? '#14111a' : shade(col, -0.2),
  };
  const P = size / 8;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    let rr = r, cc = c;
    if (rot === 1) { rr = 7 - c; cc = r; } else if (rot === 2) { rr = 7 - r; cc = 7 - c; } else if (rot === 3) { rr = c; cc = 7 - r; }
    const k = BEAD[rr][cc];
    if (k === '.') continue;
    c2.fillStyle = pal[k];
    const x0 = Math.round(x + c * P), y0 = Math.round(y + r * P);
    c2.fillRect(x0, y0, Math.round(x + (c + 1) * P) - x0, Math.round(y + (r + 1) * P) - y0);
  }
}

function drawFoodBall(x, y, r, ch, turn) {

  c2.fillStyle = col; c2.fillRect(x + u, y + u, w - 2 * u, h - 2 * u);
}

// ---- 그림 바깥 네모 길 ----
function trackParam(T, x, y) {
  const w = T.x1 - T.x0, h = T.y1 - T.y0;
  if (Math.abs(y - T.y0) < 0.5) return x - T.x0;
  if (Math.abs(x - T.x1) < 0.5) return w + (y - T.y0);
  if (Math.abs(y - T.y1) < 0.5) return w + h + (T.x1 - x);
  return 2 * w + h + (T.y1 - y);
}
// a에서 b까지 네모 길을 따라 (짧은 쪽으로) 가는 꺾임점들. b 포함
function along(T, a, b) {
  const w = T.x1 - T.x0, h = T.y1 - T.y0, P = 2 * w + 2 * h;
  const ta = trackParam(T, a.x, a.y), tb = trackParam(T, b.x, b.y);
  let d = ((tb - ta) % P + P) % P, dir = 1;
  if (d > P / 2) { d = P - d; dir = -1; }
  const corners = [[0, T.x0, T.y0], [w, T.x1, T.y0], [w + h, T.x1, T.y1], [2 * w + h, T.x0, T.y1]];
  const pts = corners
    .map(([t, x, y]) => ({ dd: dir > 0 ? ((t - ta) % P + P) % P : ((ta - t) % P + P) % P, x, y }))
    .filter(o => o.dd > 0.01 && o.dd < d - 0.01)
    .sort((p, q) => p.dd - q.dd)
    .map(o => ({ x: o.x, y: o.y }));
  pts.push({ x: b.x, y: b.y });
  return pts;
}
function trackDist(T, a, b) {
  const P = 2 * (T.x1 - T.x0) + 2 * (T.y1 - T.y0);
  const d = ((trackParam(T, b.x, b.y) - trackParam(T, a.x, a.y)) % P + P) % P;
  return Math.min(d, P - d);
}
// 그림 크기에 따른 위치 정보 (게임과 순서 시뮬레이션이 같이 씀)
function geometry(R, C) {
  const cs = Math.floor(Math.min(PIC.w / C, PIC.h / R, 30));
  const gx = Math.round(W / 2 - C * cs / 2), gy = Math.round(PIC.y + (PIC.h - R * cs) / 2);
  return { cs, gx, gy, T: { x0: PIC.x - TRACK_M, y0: PIC.y - TRACK_M, x1: PIC.x + PIC.w + TRACK_M, y1: PIC.y + PIC.h + TRACK_M } };
}
const geoCenter = (geo, r, c) => ({ x: geo.gx + c * geo.cs + geo.cs / 2, y: geo.gy + r * geo.cs + geo.cs / 2 });
function geoEntry(geo, r, c, side) {
  const T = geo.T, p = geoCenter(geo, r, c);

// 집에서 나와 굴을 비켜 길로 올라가는 첫 지점
function startPoints(geo, sx, sy) {
  let dx = sx;
  if (Math.abs(sx - HOLE.x) < HOLE_DETOUR) dx = HOLE.x + (sx >= HOLE.x ? HOLE_DETOUR : -HOLE_DETOUR);
  const T = geo.T, px = Math.max(T.x0, Math.min(T.x1, dx));
  return dx !== sx ? [{ x: dx, y: sy }, { x: px, y: T.y1 }] : [{ x: px, y: T.y1 }];
}
// 후보 경로의 길이 (집 → 길 → 들어가는 지점 → 빈 길로 꺾어서 → 음식)
function candEntry(geo, info, k, cand) {
  const C = info.C, r = Math.floor(k / C), c = k % C;
  if (cand.via < 0) return { E: geoEntry(geo, r, c, cand.side), first: geoCenter(geo, r, c) };
  const rk = info.root[cand.via], rr = Math.floor(rk / C), rc = rk % C;
  return { E: geoEntry(geo, rr, rc, borderSide(rr, rc, info.R, C)), first: geoCenter(geo, rr, rc) };
}
function pathCost(geo, info, sx, sy, k, cand) {
  const sp = startPoints(geo, sx, sy), P1 = sp[sp.length - 1];
  const { E, first } = candEntry(geo, info, k, cand);
  return Math.abs(sx - sp[0].x) + Math.abs(sy - P1.y) + trackDist(geo.T, P1, E) +

// 실제 이동 경로: 갈 때 꺾임점들 + 돌아올 때 쓸 안쪽 길
function makePath(sx, sy, k, cand) {
  const info = game.reach, C = info.C, T = game.T;
  const sp = startPoints(game, sx, sy), P1 = sp[sp.length - 1];
  const { E } = candEntry(game, info, k, cand);
  const inner = [];   // 길 → 음식 사이 빈칸 중심들
  if (cand.via >= 0) {
    const chain = [];
    for (let n = cand.via; n >= 0; n = info.par[n]) chain.push(n);
    chain.reverse();
    for (const n of chain) { const p = geoCenter(game, Math.floor(n / C), n % C); inner.push(p); }
  }
  const [tx, ty] = cellCenter(Math.floor(k / C), k % C);
  const go = simplify([...sp, ...along(T, P1, E), ...inner, { x: tx, y: ty }]);

// 일직선 위의 중간 점은 빼서 꺾이는 곳만 남김
function simplify(pts) {
  const out = [];
  for (const p of pts) {
    if (out.length && Math.hypot(out[out.length - 1].x - p.x, out[out.length - 1].y - p.y) < 0.01) continue;
    if (out.length >= 2) {
      const a = out[out.length - 2], b = out[out.length - 1];

  }

}

}

function findTarget(color, sx, sy) {

  for (const [k, cands] of info.acc) {
    const r = Math.floor(k / game.C), c = k % game.C;
    if (game.grid[r][c] !== color || game.reserved[r][c]) continue;
    for (const cand of cands) {
      const d = pathCost(game, info, sx, sy, k, cand);
      if (d < bd) { bd = d; best = { k, r, c, cand }; }
    }
  }
  if (best) best.path = makePath(sx, sy, best.k, best.cand);

}

  }
  return false;

function tryPick(c, i) {
  const a = game.queues[c][i];
  if (i > 0) { a.shake = 0.4; toast('맨 위에 있는 쇠똥구리만 고를 수 있어요'); beep(160, 0.1, 0.03); return; }
  const members = a.group ? a.group.members.slice() : [a];
  if (a.group && !members.every(m => game.queues[m.col][0] === m)) {
    members.forEach(m => m.shake = 0.4);
    toast('사슬로 묶인 둘이 모두 맨 위에 있어야 해요');
    beep(160, 0.1, 0.03);

  }
  const free = freeSlots();
  if (free.length < members.length) {
    members.forEach(m => m.shake = 0.4);
    toast(members.length > 1 ? `빈 자리가 ${members.length}칸 필요해요` : '일터에 빈 자리가 없어요');
    beep(160, 0.1, 0.03);

  members.sort((p, q) => p.col - q.col).forEach((m, k) => {
    game.queues[m.col].shift();
    m.inSlot = true; m.slot = free[k]; m.cool = 0.2; m.owner = game.turn;

}

    if (!a.group) return true;
    const ms = a.group.members;
    if (ms.every(m => game.queues[m.col][0] === m) && free >= ms.length) return true;
  }

}

// ================== 업데이트 ==================
function update(dt) {
  time += dt;
  if (toastMsg) { toastMsg.t -= dt; if (toastMsg.t <= 0) toastMsg = null; }
  if (overlay === 'clear' || overlay === 'vsEnd') {
    clearT += dt;
    for (const p of confetti) { p.y += p.vy * dt; p.sw += dt * 4; if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; } }
  }
  if (screen !== 'play' || !games.length) return;
  for (const gm of games) { game = gm; updateGame(dt); }
  game = games[0];
}
function updateGame(dt) {
  const sdt = dt * speed;   // 배속 적용
  if (game.toast) { game.toast.t -= dt; if (game.toast.t <= 0) game.toast = null; }
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }
  for (const f in game.fx) game.fx[f] = Math.max(0, game.fx[f] - sdt);

  const k = Math.min(1, dt * 11);
  game.queues.forEach((q, c) => q.forEach((a, i) => { a.tx = colX(c); a.ty = qPosY(i); }));
  game.slots.forEach((a, s) => { if (a) { const p = slotCenter(s); a.tx = p.x; a.ty = p.y; } });
  for (const a of [...game.queues.flat(), ...game.slots.filter(Boolean)]) {
    a.x += (a.tx - a.x) * k; a.y += (a.ty - a.y) * k;
    if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
  }

  // 일터 쇠똥구리가 자기 집에서 일꾼 쇠똥구리를 내보냄
  if (game.state === 'play') {
    const gap = DISPATCH_GAP / (game.fx.swarm > 0 ? 3 : 1);
    game.slots.forEach((a, s) => {
      if (!a || Math.hypot(a.tx - a.x, a.ty - a.y) > 4) return;
      a.cool -= sdt;
      while (a.cool <= 0) {
        const h = homePos(s);
        const t = findTarget(a.color, h.x, h.y);
        if (!t) { a.cool = 0; return; }
        game.reserved[t.r][t.c] = true;
        game.carriers.push({ color: a.color, owner: a.owner, x: h.x, y: h.y, r: t.r, c: t.c, E: t.path.E, inner: t.path.inner,
          pts: t.path.go, i: 0, state: 'go', walk: Math.random(), ang: -PI / 2, roll: 0, lag: -a.cool });
        a.dispatched++; a.cool += gap;
        if (a.dispatched >= a.total) {          // 다 보냈으면 바로 사라짐
          game.slots[s] = null;
          burst(a.x, a.y, '#ffffff', 10, 70);
          beep(880, 0.06, 0.03);
          return;
        }
      }
    });
  }

  const mul = (game.fx.speed > 0 ? 2 : 1) * (game.fx.slow > 0 ? 0.5 : 1);
  for (const cr of game.carriers) {
    // 이번 프레임 중간에 출발한 쇠똥구리는 출발 후 지난 시간만큼만 움직임
    let step = SPEED * mul * (cr.lag !== undefined ? Math.min(cr.lag, sdt) : sdt);
    delete cr.lag;
    cr.walk += sdt * mul;
    if (cr.state === 'back' && Math.random() < Math.min(1, sdt * 4)) {
      const ux = Math.cos(cr.ang);
      game.particles.push({ x: cr.x - ux * 4 + (Math.random() * 8 - 4), y: cr.y + ballR() - 1,
        vx: -ux * 20 + (Math.random() * 16 - 8), vy: -25 - Math.random() * 20, life: 0.35, color: '#cfae80', s: 3 });
    }
    while (step > 0 && !cr.done) {
      const t = cr.pts[cr.i];
      const dx = t.x - cr.x, dy = t.y - cr.y, d = Math.hypot(dx, dy);
      if (d > 0.01) cr.ang = Math.atan2(dy, dx);
      if (d > step) {
        cr.x += dx / d * step; cr.y += dy / d * step;
        if (cr.state === 'back') cr.roll += step;
        step = 0;
      } else {
        cr.x = t.x; cr.y = t.y; step -= d;
        if (cr.state === 'back') cr.roll += d;
        if (++cr.i < cr.pts.length) continue;
        if (cr.state === 'go') {
          const key = cr.r * game.C + cr.c;
          game.grid[cr.r][cr.c] = null;
          game.reserved[cr.r][cr.c] = false;
          clearCell(cr.r, cr.c);
          game.reach = reachMap(game.grid);
          game.remaining--;
          if (game.items.has(key)) { cr.item = game.items.get(key); game.items.delete(key); }
          cr.state = 'back'; cr.pts = backPath(cr); cr.i = 0;
          vibrate(12);
        } else {
          cr.done = true;
          game.score[cr.owner || 0]++;
          burst(HOLE.x, HOLE.y - 4, COLORS[cr.color], 3);
          if (cr.item) activateItem(cr.item);
          if (time - lastBeep > 0.05) { lastBeep = time; beep(1100 + Math.random() * 300, 0.03, 0.015); }
        }
      }
    }
  }
  game.carriers = game.carriers.filter(c => !c.done);

  for (const p of game.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  game.particles = game.particles.filter(p => p.life > 0);

  if (game.state === 'play') {
    if (game.remaining === 0 && game.carriers.length === 0) {
      game.endT += dt;
      if (game.endT > 0.4) startClear();
    } else {
      const busy = game.carriers.length > 0 ||
        game.slots.some(s => s && Math.hypot(s.tx - s.x, s.ty - s.y) > 4);
      if (!busy && !slotCanWork() && !canPickAny()) {
        game.stuckT += dt;
        if (game.stuckT > 0.9) {
          if (mode === 'versus') endVersus(1 - game.player, false);
          else { game.state = 'fail'; overlay = 'fail'; melody([392, 330, 262], 150, 0.05); }
        }
      } else game.stuckT = 0;
    }
  }
}

function text(t, x, y, size, color, align = 'center', stroke = null) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  x = Math.round(x); y = Math.round(y);
  if (stroke) {
    ctx.fillStyle = stroke;
    const o = Math.max(1, Math.round(size / 10));
    for (const [dx, dy] of [[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o]]) ctx.fillText(t, x + dx, y + dy);
  }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function fitSize(t, maxW, size, min = 10) {
  for (let s = size; s > min; s -= 1) { ctx.font = `${s}px ${FONT}`; if (ctx.measureText(t).width <= maxW) return s; }
  return min;
}
function pxBox(x, y, w, h, fill, border = OUTLINE, u = 3) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = border;
  ctx.fillRect(x + u, y, w - 2 * u, h);
  ctx.fillRect(x, y + u, w, h - 2 * u);
  ctx.fillStyle = fill;
  ctx.fillRect(x + u, y + u, w - 2 * u, h - 2 * u);
}

  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(Math.round(x + 3), Math.round(y + h - 6), Math.round(w - 6), 3);
  text(label, x + w / 2, y + h / 2, size, tc);

function pxStar(x, y, s, color) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = color;
  ctx.fillRect(x - s, y - s * 3, s * 2, s * 6);
  ctx.fillRect(x - s * 3, y - s, s * 6, s * 2);

}

// ================== 화면: 플레이 ==================
function shakeOf(a) { return a.shake > 0 ? Math.round(Math.sin(a.shake * 60) * 5 * (a.shake / 0.4)) : 0; }
function drawPlay() {
  const g = game;
  const vs = mode === 'versus';
  pxBox(8, 8, W - 16, 58, vs ? shade(PCOL[g.player], -0.45) : '#4a3020');
  button(16, 16, 44, 38, '◀', goMenu, '#f3e3c3', '#3a2412', 16);
  button(vs ? W - 76 : W - 132, 16, 58, 38, `${speed}배속`, cycleSpeed, speed > 1 ? '#ffd34d' : '#f3e3c3', '#3a2412', 12);
  if (!vs) button(W - 68, 16, 52, 38, '다시', () => startStage(g.idx), '#f3e3c3', '#3a2412', 12);
  const title = (vs ? `${g.player + 1}P · ` : '') + `${g.idx + 1}. ${STAGES[g.idx].name}`;
  const tx = vs ? (68 + W - 80) / 2 : (68 + W - 136) / 2;
  text(title, tx, 27, fitSize(title, 196, 16), '#ffffff');
  const pr = 1 - g.remaining / g.total;
  pxBox(tx - 102, 40, 204, 16, OUTLINE, OUTLINE, 2);
  ctx.fillStyle = '#ffd34d'; ctx.fillRect(tx - 99, 43, Math.round(198 * pr), 10);
  ctx.fillStyle = '#fff3a0'; ctx.fillRect(tx - 99, 43, Math.round(198 * pr), 3);

  ctx.drawImage(g.pic, g.gx, g.gy, g.C * g.cs, g.R * g.cs);

  // 아이템 효과 표시
  let fy = PIC.y + 4;
  for (const [f, it] of [['speed', ITEMS.speed], ['swarm', ITEMS.swarm], ['slow', ITEMS.slow]]) {
    if (g.fx[f] <= 0) continue;
    const label = `${it.icon} ${f === 'slow' ? '느려짐' : it.name.replace('!', '')} ${Math.ceil(g.fx[f])}`;
    ctx.font = `12px ${FONT}`;
    const w = ctx.measureText(label).width + 14;
    pxBox(PIC.x, fy, w, 20, f === 'slow' ? '#ffd0dc' : it.color, OUTLINE, 2);
    text(label, PIC.x + 7, fy + 10, 12, '#3a2412', 'left');
    fy += 24;
  }

  for (let k = 0; k < 5; k++) {
    drawHome(k, g.slots[k] && g.slots[k].color);
    if (g.slots[k]) continue;
    const x = SLOT.x0 + k * (SLOT.w + SLOT.gap) + 8, y = SLOT.y + 8, w = SLOT.w - 16, h = SLOT.h - 16;
    ctx.fillStyle = PAD.dash;
    for (let t = 0; t < w; t += 8) { ctx.fillRect(x + t, y, 4, 3); ctx.fillRect(x + t, y + h - 3, 4, 3); }
    for (let t = 0; t < h; t += 8) { ctx.fillRect(x, y + t, 3, 4); ctx.fillRect(x + w - 3, y + t, 3, 4); }
  }

  // 협동 모드: 누구 차례인지
  if (mode === 'coop' && g.state === 'play') {
    const c = PCOL[g.turn];
    ctx.fillStyle = c; ctx.fillRect(10, Q.y - 6, W - 20, 4); ctx.fillRect(10, H - 10, W - 20, 4);
    pxBox(W / 2 - 54, Q.y - 16, 108, 22, c, OUTLINE, 2);
    text(`${g.turn + 1}P 차례`, W / 2, Q.y - 5, 14, '#ffffff', 'center', OUTLINE);
  }

  // 대기열
  ctx.save();
  ctx.beginPath(); ctx.rect(10, Q.y - 4, W - 20, H - Q.y - 4); ctx.clip();
  const drawn = new Set();
  g.queues.flat().forEach(a => {
    if (!a.group || drawn.has(a.group)) return;
    drawn.add(a.group);
    const [p, q] = a.group.members.slice().sort((m, n) => m.col - n.col);
    const x1 = p.x + shakeOf(p), y1 = p.y + 2, x2 = q.x + shakeOf(q), y2 = q.y + 2;
    const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.floor(len / 8));
    for (let j = 1; j < n; j++) {
      const t = j / n, x = Math.round(x1 + (x2 - x1) * t), y = Math.round(y1 + (y2 - y1) * t);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 4, y - 3, 8, 6);
      ctx.fillStyle = j % 2 ? '#d8dde6' : '#9aa2b0'; ctx.fillRect(x - 3, y - 2, 6, 4);
    }
  });
  g.queues.forEach(q => {
    for (let i = q.length - 1; i >= 0; i--) {
      const a = q[i];
      if (a.y > H + 40) continue;
      const x = a.x + shakeOf(a);
      if (i === 0) {
        const on = Math.floor(time * 3) % 2 === 0;
        ctx.fillStyle = mode === 'coop' ? PCOL[g.turn] : (on ? '#e0a020' : '#c07a10');
        const bx = Math.round(x - 30), by = Math.round(a.y - 30), bw = 60, bh = 60;
        for (const [cx, cy, sx, sy] of [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]]) {
          ctx.fillRect(sx > 0 ? cx : cx - 10, sy > 0 ? cy : cy - 3, 10, 3);
          ctx.fillRect(sx > 0 ? cx : cx - 3, sy > 0 ? cy : cy - 10, 3, 10);
        }
      }
      drawSprite('beetle0', a.color, 0, 3, x, a.y, i === 0 ? 1 : 0.85);
      text(String(a.total), x, a.y + 9, 16, '#ffffff', 'center', OUTLINE);
    }
  });
  ctx.restore();

  // 일터 쇠똥구리
  g.slots.forEach(a => {
    if (!a) return;
    const fr = Math.floor(time * 6) % 2;
    drawSprite('beetle' + fr, a.color, 0, 3, a.x + shakeOf(a), a.y);
    text(String(a.total - a.dispatched), a.x, a.y + 9, 16, '#ffffff', 'center', OUTLINE);
    if (mode === 'coop') {
      pxBox(a.x - 34, a.y - 42, 22, 16, PCOL[a.owner], OUTLINE, 2);
      text(`${a.owner + 1}P`, a.x - 23, a.y - 34, 10, '#ffffff');
    }
  });

  // 일꾼 쇠똥구리
  const BP = beetlePx(), r = ballR();
  for (const cr of g.carriers) {
    // 가지러 갈 때: 머리가 이동 방향을 바라봄
    // 굴려 올 때: 진짜 쇠똥구리처럼 거꾸로(뒷걸음) 물구나무 서서 뒷다리로 음식을 밂
    const fr = Math.floor(cr.walk * 8) % 2;
    const ux = Math.cos(cr.ang), uy = Math.sin(cr.ang);
    const vertical = Math.abs(uy) > Math.abs(ux);
    const face = ux >= 0 ? 1 : -1, flip = face < 0;
    const sv = uy < 0 ? -1 : 1;
    ctx.fillStyle = 'rgba(40,25,10,.25)';
    if (cr.state === 'go') {
      if (vertical) {
        drawSprite('beetle' + fr, cr.color, sv < 0 ? 0 : 2, BP, cr.x, cr.y);
      } else {
        const sp = getSprite('beetleWalk' + fr, cr.color, 0, BP, flip);
        ctx.beginPath(); ctx.ellipse(cr.x, cr.y + sp.lh / 2, sp.lw * 0.45, 1.5, 0, 0, PI * 2); ctx.fill();
        drawSprite('beetleWalk' + fr, cr.color, 0, BP, cr.x, cr.y, 1, flip);
      }
    } else {
      const turn = (vertical ? sv : face) * cr.roll / r;
      if (vertical) {
        const sp = getSprite('beetle' + fr, cr.color, sv < 0 ? 2 : 0, BP);
        drawSprite('beetle' + fr, cr.color, sv < 0 ? 2 : 0, BP, cr.x, cr.y - sv * (r + sp.lh / 2 - 1));
        ctx.fillStyle = 'rgba(40,25,10,.25)';
        ctx.beginPath(); ctx.ellipse(cr.x, cr.y + r * 0.85, r, 1.5, 0, 0, PI * 2); ctx.fill();
        drawFoodBall(cr.x, cr.y, r, cr.color, turn);
      } else {
        const ground = cr.y + r;
        const sp = getSprite('beetlePush' + fr, cr.color, 0, BP, flip);
        const bx = cr.x - face * (r * 0.85 + sp.lw / 2 - 1);
        ctx.beginPath(); ctx.ellipse(cr.x - face * sp.lw * 0.5, ground, r + sp.lw * 0.6, 1.5, 0, 0, PI * 2); ctx.fill();
        drawSprite('beetlePush' + fr, cr.color, 0, BP, bx, ground - sp.lh / 2, 1, flip);
        drawFoodBall(cr.x, cr.y, r, cr.color, turn);
      }
      if (cr.item && Math.floor(time * 8) % 2) pxStar(cr.x + r, cr.y - r, 1, '#fff6a0');   // 아이템 든 음식은 반짝
    }
  }
  for (const p of g.particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;

  // 아이템 발동 배너
  if (g.banner) {
    const b = g.banner, k = Math.min(1, (1.6 - b.t) / 0.2);
    const size = Math.round(26 * (0.6 + 0.4 * easeBack(k)));
    ctx.globalAlpha = Math.min(1, b.t * 3);
    pxBox(W / 2 - 150, PIC.y + PIC.h / 2 - 40, 300, 78, b.color, OUTLINE, 4);
    text(b.text, W / 2, PIC.y + PIC.h / 2 - 14, size, '#3a2412');
    text(b.sub, W / 2, PIC.y + PIC.h / 2 + 18, 13, '#3a2412');
    ctx.globalAlpha = 1;
  }
  // 이 화면의 안내 문구
  if (g.toast) {
    ctx.font = `14px ${FONT}`;
    const w = Math.min(W - 30, ctx.measureText(g.toast.text).width + 36);
    ctx.globalAlpha = Math.min(1, g.toast.t * 3);
    pxBox(W / 2 - w / 2, 488, w, 40, '#2a1a10', OUTLINE, 3);
    text(g.toast.text, W / 2, 508, 14, '#ffffff');
    ctx.globalAlpha = 1;
  }
}

// 경쟁 모드: 아래(1P)는 그대로 절반 크기, 위(2P)는 180도 돌려서 마주 보게
function viewTransform(i) {
  if (mode !== 'versus') return;
  if (i === 0) { ctx.translate(105, 400); ctx.scale(0.5, 0.5); }
  else { ctx.translate(315, 400); ctx.rotate(PI); ctx.scale(0.5, 0.5); }
}
function toLocal(i, x, y) {
  if (mode !== 'versus') return { x, y };
  if (i === 0) return { x: (x - 105) * 2, y: (y - 400) * 2 };
  return { x: (315 - x) * 2, y: (400 - y) * 2 };
}

// ================== 오버레이 ==================
function panel(y, h) {
  ctx.fillStyle = 'rgba(20,12,5,.6)'; ctx.fillRect(0, 0, W, H);
  pxBox(28, y + 6, W - 56, h, OUTLINE, OUTLINE, 4);
  pxBox(28, y, W - 56, h, '#fff6e0', OUTLINE, 4);
}
const easeBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function drawRays(cx, cy, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(cx, cy); ctx.rotate(time * 0.3);
  ctx.fillStyle = '#ffe9a0';
  for (let k = 0; k < 12; k++) { ctx.rotate(PI / 6); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-30, -500); ctx.lineTo(30, -500); ctx.fill(); }
  ctx.restore();
}
function drawConfetti() {
  for (const p of confetti) {
    if (p.y < 0) continue;
    ctx.fillStyle = p.c;
    ctx.fillRect(Math.round(p.x + Math.sin(p.sw) * 8), Math.round(p.y), p.s, Math.max(2, Math.round(p.s * Math.abs(Math.cos(p.sw)))));
  }
}
function drawClear() {
  const t = clearT, g = game;
  const last = g.idx === BASE_COUNT - 1, custom = g.idx >= BASE_COUNT;
  ctx.fillStyle = `rgba(30,18,40,${Math.min(0.85, t * 1.6)})`; ctx.fillRect(0, 0, W, H);
  if (t > 0.2) drawRays(W / 2, 260, Math.min(0.25, (t - 0.2) * 0.5));
  // 그림 틀이 커지며 고해상도 그림 등장
  const asp = hiresAspect(g.idx);
  let fw = 336, fh = fw / asp;
  if (fh > 300) { fh = 300; fw = fh * asp; }
  fw = Math.round(fw); fh = Math.round(fh);
  const tx = (W - fw) / 2, ty = 110 + (300 - fh) / 2;
  const k = Math.min(1, t / 0.75), e = easeBack(k);
  const sx = g.gx, sy = g.gy, sw = g.C * g.cs, sh = g.R * g.cs;
  const x = sx + (tx - sx) * e, y = sy + (ty - sy) * e, w = sw + (fw - sw) * e, h = sh + (fh - sh) * e;
  pxBox(x - 12, y - 12 + 6, w + 24, h + 24, OUTLINE, OUTLINE, 4);
  pxBox(x - 12, y - 12, w + 24, h + 24, '#e9b04a', OUTLINE, 4);
  ctx.fillStyle = '#ffd77a'; ctx.fillRect(Math.round(x - 8), Math.round(y - 8), Math.round(w + 16), 3);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(x - 3), Math.round(y - 3), Math.round(w + 6), Math.round(h + 6));
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(hiresFor(g.idx, fw, fh), Math.round(x), Math.round(y), Math.round(w), Math.round(h));
  ctx.imageSmoothingEnabled = false;
  if (t < 0.35) { ctx.fillStyle = `rgba(255,255,255,${(0.35 - t) * 2.6})`; ctx.fillRect(x, y, w, h); }
  if (t > 0.6) for (let i = 0; i < 8; i++) {
    const a = i / 8 * PI * 2 + 0.3, rx = fw / 2 + 26, ry = fh / 2 + 26;
    const tw = Math.sin(time * 6 + i * 1.7);
    if (tw > -0.2) pxStar(W / 2 + Math.cos(a) * rx, ty + fh / 2 + Math.sin(a) * ry, tw > 0.5 ? 3 : 2, i % 2 ? '#fff6a0' : '#ffffff');
  }
  drawConfetti();
  if (t > 0.6) {
    const bt = Math.min(1, (t - 0.6) / 0.4);
    const size = Math.round(28 * (0.6 + 0.4 * easeBack(bt)));
    text(custom ? '내 사진 완성!' : last ? '모든 스테이지 클리어!' : '냠냠! 클리어!', W / 2, 446, size, '#ffe08a', 'center', OUTLINE);
    const sub = mode === 'coop' ? `팀워크 최고! 1P ${g.score[0]}개 · 2P ${g.score[1]}개` : `'${STAGES[g.idx].name}' 을(를) 다 먹었어요`;
    text(sub, W / 2, 484, 14, '#ffffff', 'center', OUTLINE);
  }
  if (t > 1.0) {
    if (custom) button(W / 2 - 100, 516, 200, 54, '📷 다른 사진으로', pickPhoto, '#ffb0d0');
    else if (!last) button(W / 2 - 100, 516, 200, 54, '다음 스테이지 ▶', () => startStage(g.idx + 1));
    button(W / 2 - 70, last ? 524 : 586, 140, 44, '목록으로', goMenu, '#e8dcc4', '#3a2412', 16);
  }
}
// 경쟁 모드 결과: 양쪽에 각자 방향으로 승패 표시
function drawVsEnd() {
  const t = clearT;
  ctx.fillStyle = `rgba(30,18,40,${Math.min(0.7, t * 1.6)})`; ctx.fillRect(0, 0, W, H);
  drawConfetti();
  for (const i of [0, 1]) {
    ctx.save();
    if (i === 1) { ctx.translate(W, 400); ctx.rotate(PI); ctx.translate(0, -400); }
    const win = vsWinner === i;
    const k = Math.min(1, t / 0.5);
    const size = Math.round((win ? 34 : 26) * (0.6 + 0.4 * easeBack(k)));
    pxBox(60, 490, W - 120, 120, win ? '#ffe08a' : '#d8d0c4', OUTLINE, 4);
    text(win ? `${i + 1}P 승리!` : `${i + 1}P 아쉬워요`, W / 2, 530, size, win ? '#c2561b' : '#5c4a38');
    text(win ? '먼저 다 먹었어요 🎉' : '다음엔 이길 수 있어요!', W / 2, 572, 14, '#3a2412');
    ctx.restore();
  }
  if (t > 0.8) {
    button(W / 2 - 75, 372, 150, 26, '다시 대결', () => startStage(game.idx), '#ffd34d', '#3a2412', 14);
    button(W / 2 - 75 + 160, 372, 60, 26, '목록', goMenu, '#e8dcc4', '#3a2412', 12);
  }
}
function drawOverlay() {
  if (overlay === 'help') {
    panel(90, 610);
    text('게임 방법', W / 2, 126, 24, '#3a2412');
    const lines = [
      ['b', '위 그림은 동글동글 음식이에요.'],
      ['a', '아래 3줄의 맨 위 쇠똥구리를 눌러'],
      ['', '일터(5칸)로 보내요.'],
      ['c', '숫자만큼 일꾼이 집에서 나와 그림판'],
      ['', '가장자리를 돌다 빈 길로 꺾어 들어가'],
      ['', '같은 색 음식을 가져와요.'],
      ['', '올 땐 거꾸로 굴려서 굴로 쏙!'],
      ['l', '사슬로 묶인 둘은 함께 맨 위에 있어야 해요.'],
      ['i', '음식 속 숨은 아이템: 질주 · 총출동 · 사슬 끊기'],
      ['m', '메뉴의 모드 버튼: 혼자 / 협동 / 경쟁'],
      ['', '협동: 둘이 번갈아 고르기'],
      ['', '경쟁: 폰을 가운데 두고 마주 보고 대결'],
      ['p', '📷 내 사진으로: 사진을 도트 음식으로 바꿔서 플레이'],
      ['s', '배속 버튼: 1·2·3·5·9배속'],
      ['x', '일터가 꽉 막히면 실패!'],
      ['o', '음식을 다 옮기면 클리어!'],
    ];
    lines.forEach(([ic, t], i) => {
      const y = 162 + i * 29;
      if (ic === 'a') drawSprite('beetle0', 'R', 0, 1.4, 62, y);
      else if (ic === 'c') drawSprite('beetleWalk0', 'B', 0, 1.6, 62, y);
      else if (ic === 'b') paintBead(ctx, 54, y - 8, 16, 'Y');
      else if (ic === 'l') { ctx.fillStyle = '#9aa2b0'; ctx.fillRect(52, y - 2, 20, 4); }
      else if (ic === 'i') text('⚡', 62, y, 16, '#d08a20');
      else if (ic === 'm') text('👥', 62, y, 14, '#3a2412');
      else if (ic === 'p') { paintBead(ctx, 54, y - 8, 16, 'K'); }
      else if (ic === 's') text('»', 62, y, 16, '#d08a20');
      else if (ic === 'x') text('✕', 62, y, 16, '#d0453a');
      else if (ic === 'o') text('★', 62, y, 16, '#e0a020');
      text(t, 84, y, fitSize(t, 300, 14, 10), '#3a2412', 'left');
    });
    button(W / 2 - 80, 640, 160, 46, '알겠어요!', () => { overlay = null; });
  } else if (overlay === 'clear') {
    drawClear();
  } else if (overlay === 'vsEnd') {
    drawVsEnd();
  } else if (overlay === 'fail') {
    panel(220, 300);
    text('쇠똥구리들이 꼼짝 못 해요!', W / 2, 266, 20, '#b33a2a');
    text('일터가 꽉 차서 더 옮길 수 없어요.', W / 2, 300, 14, '#3a2412');
    drawSprite('beetle' + (Math.floor(time * 4) % 2), 'R', 0, 3, W / 2, 352);
    button(W / 2 - 80, 400, 160, 50, '다시 하기', () => startStage(game.idx));
    button(W / 2 - 70, 462, 140, 42, '목록으로', goMenu, '#e8dcc4', '#3a2412', 16);
  }
}

function drawToast() {
  if (!toastMsg) return;
  ctx.font = `14px ${FONT}`;
  const w = Math.min(W - 30, ctx.measureText(toastMsg.text).width + 36);
  ctx.globalAlpha = Math.min(1, toastMsg.t * 3);
  pxBox(W / 2 - w / 2, 488, w, 40, '#2a1a10', OUTLINE, 3);
  text(toastMsg.text, W / 2, 508, 14, '#ffffff');
  ctx.globalAlpha = 1;
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
  cvs.width = Math.round(W * s * dpr);
  cvs.height = Math.round(H * s * dpr);
  RES = s * dpr;
  mainCtx.setTransform(RES, 0, 0, RES, 0, 0);
  mainCtx.imageSmoothingEnabled = false;
  spriteCache.clear(); thumbCache.clear(); hiresCache.clear(); layers = {};
  const cur = game;
  for (const gm of games) { game = gm; buildPicCache(); }
  game = cur;
}
window.addEventListener('resize', resize);

// ================== 입력 ==================
function toScreen(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
// 사진 고르기 창은 click 이벤트 안에서 열어야 모바일(특히 아이폰)에서도 열림
cvs.addEventListener('click', () => {
  if (!photoWanted) return;
  photoWanted = false;
  photoInput.click();
});
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  userTapped = true;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  else if (ac.state === 'suspended') ac.resume();
  const s = toScreen(e);
  const inst = mode === 'versus' && screen === 'play' ? (s.y >= 400 ? 0 : 1) : 0;
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    let p = s;
    if (b.inst !== null && b.inst !== undefined) { if (b.inst !== inst) continue; p = toLocal(inst, s.x, s.y); }
    if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h + 4) { beep(660, 0.05, 0.03); b.fn(); return; }
  }
  if (overlay || screen !== 'play' || !games.length) return;
  game = games[inst];
  if (!game || game.state !== 'play') return;
  const { x, y } = toLocal(inst, s.x, s.y);
  for (let c = 0; c < 3; c++) {
    const q = game.queues[c];
    for (let i = 0; i < q.length; i++) {
      const a = q[i];
      if (Math.abs(x - a.x) < Q.colW / 2 && Math.abs(y - a.y) < Q.rowH / 2) { tryPick(c, i); return; }
    }
  }
});

// ================== 루프 ==================
resize();
if (document.fonts && document.fonts.load) document.fonts.load(`16px DungGeunMo`).catch(() => {});
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  btns = [];
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (screen === 'menu') {
    curInst = null;
    ctx.drawImage(layer('ground', drawGround), 0, 0, W, H);
    drawMenu();
  } else {
    if (mode === 'versus') { ctx.fillStyle = '#2b1d14'; ctx.fillRect(0, 0, W, H); }
    games.forEach((gm, i) => {
      game = gm; curInst = mode === 'versus' ? i : null;
      ctx.save(); viewTransform(i);
      ctx.drawImage(layer('play', drawPlayStatic), 0, 0, W, H);
      drawPlay();
      ctx.restore();
    });
    game = games[0]; curInst = null;
    if (mode === 'versus') { ctx.fillStyle = OUTLINE; ctx.fillRect(0, 397, W, 6); ctx.fillStyle = '#ffd34d'; ctx.fillRect(0, 399, W, 2); }
  }
  if (overlay) btns = [];
  drawToast();
  drawOverlay();
  requestAnimationFrame(frame);
}
goMenu();
requestAnimationFrame(frame);
</script>
</body>
