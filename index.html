const shadeMemo = {};
function shade(hex, amt) {
  const key = hex + amt;
  if (shadeMemo[key]) return shadeMemo[key];
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return (shadeMemo[key] = `rgb(${r|0},${g|0},${b|0})`);
}
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ================== 그림 처리: 확대 + 사물 테두리 + 바깥 테두리 ==================
const MAX_C = 28, MAX_R = 30;   // 테두리 포함 최대 칸 수 (음식 한 알 약 13px, 약 450피스)
function parseArt(art) {
  const rows = art.length, cols = Math.max(...art.map(s => s.length));
  const g = [];
  for (let r = 0; r < rows; r++) {
    g.push([]);
    for (let c = 0; c < cols; c++) {
      const ch = art[r][c] || '.';
      g[r].push(ch === '.' || ch === ' ' ? null : ch);
    }
  }
  return g;
}
function addOutline(base) {
  const R0 = base.length, C0 = base[0].length;
  const g = Array.from({ length: R0 + 2 }, () => Array(C0 + 2).fill(null));
  for (let r = 0; r < R0; r++) for (let c = 0; c < C0; c++) g[r + 1][c + 1] = base[r][c];
  const out = g.map(r => r.slice());
  for (let r = 0; r < g.length; r++) for (let c = 0; c < g[0].length; c++) {
    if (g[r][c]) continue;
    let near = false;
    for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < g.length && nc < g[0].length && g[nr][nc]) { near = true; break; }
    }
    if (near) out[r][c] = 'D';
  }
  return out;
}
// 그림 속 사물 사이에 검은 선: 서로 다른 색의 큰 덩어리가 맞닿은 곳에 1칸 선을 넣는다
// (눈·창문 같은 작은 덩어리는 그대로 둔다)
const LINE_MIN = 24;
function addInnerLines(g) {
  const R = g.length, C = g[0].length;
  const id = g.map(r => r.map(() => -1)), size = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if (!g[r][c] || id[r][c] >= 0) continue;
    const k = size.length, col = g[r][c], st = [[r, c]];
    id[r][c] = k; let n = 0;
    while (st.length) {
      const [y, x] = st.pop(); n++;
      for (const [dr, dc] of D4) {
        const ny = y + dr, nx = x + dc;
        if (ny < 0 || nx < 0 || ny >= R || nx >= C || id[ny][nx] >= 0 || g[ny][nx] !== col) continue;
        id[ny][nx] = k; st.push([ny, nx]);
      }
    }
    size.push(n);
  }
  const mark = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    const v = g[r][c];
    if (!v || v === 'D') continue;
    for (const [dr, dc] of [[0, 1], [1, 0]]) {
      const nr = r + dr, nc = c + dc;
      if (nr >= R || nc >= C) continue;
      const n = g[nr][nc];
      if (!n || n === 'D' || n === v) continue;
      const a = size[id[r][c]], b = size[id[nr][nc]];
      if (a < LINE_MIN || b < LINE_MIN) continue;
      mark.push(a >= b ? [r, c] : [nr, nc]);
    }
  }
  const out = g.map(r => r.slice());
  for (const [r, c] of mark) out[r][c] = 'D';
  return out;
}

// 배경 지우기
//  layers가 있으면: 각 색 묶음마다 그림 가장자리에서 그 색들로만 이어진 칸을 지움
//  없으면(사진): 가장자리에 닿은 넓은 한 색 덩어리를 차례로 지움 (그림의 1/4 이상은 남김)

// o 가장자리, b 몸, h 밝은 쪽, s 그늘, w 반짝이
const BEAD_N = 16;

  const rows = [];
  for (let y = 0; y < BEAD_N; y++) {
    let row = '';

        row += v > 0.42 ? 'h' : v < -0.42 ? 's' : 'b';

})();

    switch (ch) {

      case 'b': return dark ? '#211d28' : b;
      case 'h': return dark ? '#5a5668' : shade(b, 0.45);
      case 's': return dark ? '#15121a' : shade(b, -0.3);
      case 'e': return '#ffffff';
    }
  }

    case 'o': return dark ? '#000000' : OUTLINE;
    case 'b': return b;
    case 'h': return dark ? '#3e3a4c' : shade(b, 0.45);
    case 's': return shade(b, -0.3);

  let cv = spriteCache.get(key);
  if (cv) return cv;

    else if (dir === 2) { x = w - 1 - c; y = h - 1 - r; }

    c2.fillStyle = spriteColor(ch, color, name.startsWith('beetle') ? 'beetle' : name);
    c2.fillRect(x * P, y * P, P, P);

// 구슬 한 개를 실제 화면 픽셀 크기로 미리 그려 둠 (색·회전·크기별로 저장해서 빠르게 재사용)
function beadCanvas(ch, rot, dev) {
  const key = ch + '|' + rot + '|' + dev;
  let cv = beadCache.get(key);
  if (cv) return cv;
  const col = COLORS[ch], dark = ch === 'D';
  const pal = {
    // 음영은 은은하게 (음식이 커져도 테두리·그늘이 도드라지지 않게)
    o: dark ? '#1a1722' : shade(col, -0.2),
    b: col,
    h: dark ? '#3a3646' : shade(col, 0.2),
    w: dark ? '#5e5a6c' : shade(col, 0.5),
    s: dark ? '#221e2a' : shade(col, -0.08),
  };
  cv = document.createElement('canvas');
  cv.width = cv.height = Math.max(1, dev);
  const g = cv.getContext('2d');
  // 화면 픽셀 하나하나마다 정확한 원으로 계산 → 어떤 크기든 좌우·위아래가 똑같은 둥근 모양
  for (let y = 0; y < dev; y++) for (let x = 0; x < dev; x++) {
    let px = (x + 0.5) / dev - 0.5, py = (y + 0.5) / dev - 0.5;
    if (rot === 1) [px, py] = [py, -px]; else if (rot === 2) [px, py] = [-px, -py]; else if (rot === 3) [px, py] = [-py, px];
    const d = Math.hypot(px, py);

    if (d > 0.48) continue;
    else if (d > 0.41) k = 'o';
    else if (Math.hypot(px + 0.16, py + 0.18) < 0.09) k = 'w';
    else { const v = -(px + py) / 0.58; k = v > 0.42 ? 'h' : v < -0.42 ? 's' : 'b'; }
    g.fillStyle = pal[k];
    g.fillRect(x, y, 1, 1);
  }
  beadCache.set(key, cv);
  return cv;
}
// size는 그리는 쪽 좌표 기준. 실제 화면 픽셀 크기에 맞춰 구슬을 만들어 그려서 또렷하게

// 그림 속 네모 음식 한 칸: 8x8 도트 무늬 (도트 계단과 알갱이가 보이는 픽셀 느낌)
// h 위·왼쪽 빛, w 반짝이, b 몸, s 아래·오른쪽 그늘, O 모서리, d 어두운 알갱이, l 밝은 알갱이
// 알갱이 위치가 다른 무늬 3가지를 섞어서 찍어 낸 듯한 느낌을 줄임
// 3D 상자 모양: 테두리 1도트를 빗면으로 (위 T 가장 밝게, 왼쪽 L, 오른쪽 R, 아래 B 가장 어둡게, 모서리는 대각선으로 나눔)
// 윗면은 왼쪽 위 → 오른쪽 아래로 3단계(1·2·3) 자연스러운 그늘, 작은 반짝이 w, 알갱이 d 하나
function makeBoxPattern(speck) {
  const N = 8, rows = [];
  for (let y = 0; y < N; y++) {
    let row = '';
    for (let x = 0; x < N; x++) {
      const top = y === 0, bot = y === N - 1, left = x === 0, right = x === N - 1;
      if (top && right) row += x - y > N - 1 - x ? 'T' : 'R';
      else if (bot && left) row += 'L';
      else if (top) row += 'T';
      else if (bot) row += 'B';
      else if (left) row += 'L';
      else if (right) row += 'R';
      else if ((x === 1 || x === 2) && y === 1 || x === 1 && y === 2) row += 'w';
      else if (x === speck[0] && y === speck[1]) row += 'd';
      else { const t = (x + y - 2) / 10; row += t < 0.34 ? '1' : t < 0.67 ? '2' : '3'; }
    }

const SQUARES = [makeBoxPattern([5, 4]), makeBoxPattern([3, 5]), makeBoxPattern([5, 2])];
const squareCache = new Map();
function paintSquare(c2, x, y, w, h, ch, variant = 0) {
  const scale = c2.getTransform ? c2.getTransform().a : 1;
  const dw = Math.max(1, Math.round(w * scale)), dh = Math.max(1, Math.round(h * scale));
  const key = ch + '|' + dw + '|' + dh + '|' + variant;
  let cv = squareCache.get(key);
  if (!cv) {
    const col = COLORS[ch], dark = ch === 'D';
    const SQUARE = SQUARES[variant % SQUARES.length];
    // 이전(은은)과 강한 버전의 중간 세기
    const pal = dark ? {
      T: '#46424f', L: '#36323f', R: '#17141d', B: '#0e0c12',
      w: '#5a5668', d: '#1c1924', 1: '#2e2a37', 2: '#26222e', 3: '#211d29',
    } : {
      T: shade(col, 0.22), L: shade(col, 0.12), R: shade(col, -0.12), B: shade(col, -0.22),
      w: shade(col, 0.42), d: shade(col, -0.08),
      1: shade(col, 0.05), 2: col, 3: shade(col, -0.05),

    cv = document.createElement('canvas');

    const g = cv.getContext('2d');

    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x0 = Math.round(c * dw / N), y0 = Math.round(r * dh / N);
      const x1 = Math.round((c + 1) * dw / N), y1 = Math.round((r + 1) * dh / N);
      if (x1 <= x0 || y1 <= y0) continue;
      g.fillStyle = pal[SQUARE[r][c]];
      g.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
    squareCache.set(key, cv);
  }
  c2.drawImage(cv, x, y, w, h);
}

// 음식 그림에 남은 사물 모양대로 고해상도 그림을 오려 내고 검은 외곽선을 둘러 줌
function cutOut(img, mask) {
  const m = document.createElement('canvas');
  m.width = mask.C; m.height = mask.R;
  const mg = m.getContext('2d');
  mg.fillStyle = '#000';
  mask.cells.forEach((row, r) => row.forEach((v, c) => { if (v) mg.fillRect(c, r, 1, 1); }));
  const W2 = img.width, H2 = img.height;
  // 부드러운 모양의 마스크 (작게 그린 걸 크게 늘리면 가장자리가 둥글어짐)
  const soft = document.createElement('canvas');
  soft.width = W2; soft.height = H2;
  const sg = soft.getContext('2d');
  sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = 'high';
  sg.drawImage(m, 0, 0, W2, H2);
  const cell = W2 / mask.C;
  // 사진/그림을 마스크 모양으로 오림
  const cut = document.createElement('canvas');
  cut.width = W2; cut.height = H2;
  const cg = cut.getContext('2d');
  cg.drawImage(img, 0, 0);
  cg.globalCompositeOperation = 'destination-in';
  cg.drawImage(soft, 0, 0);
  // 외곽선: 마스크를 조금씩 밀어서 겹쳐 그린 검은 실루엣 위에 오린 그림
  const out = document.createElement('canvas');
  out.width = W2; out.height = H2;
  const og = out.getContext('2d');
  const o = Math.max(2, cell * 0.28);
  for (let a = 0; a < 8; a++) og.drawImage(soft, Math.cos(a * PI / 4) * o, Math.sin(a * PI / 4) * o);
  og.globalCompositeOperation = 'source-in';
  og.fillStyle = COLORS.D; og.fillRect(0, 0, W2, H2);
  og.globalCompositeOperation = 'source-over';
  og.drawImage(cut, 0, 0);
  return out;
}

let ac = null, lastBeep = 0, lastVib = 0, lastPick = 0, userTapped = false;
function beep(f, d, v = 0.05, type = 'square') {

}

function trackParam(T, x, y) {
  const w = T.x1 - T.x0, h = T.y1 - T.y0;
  if (Math.abs(y - T.y0) < 0.5) return x - T.x0;
  if (Math.abs(x - T.x1) < 0.5) return w + (y - T.y0);
  if (Math.abs(y - T.y1) < 0.5) return w + h + (T.x1 - x);
  return 2 * w + h + (T.y1 - y);
}
// a에서 b까지 네모 길을 따라 (짧은 쪽으로) 가는 꺾임점들. b 포함
// force: 1(시계 방향) / -1(반시계)로 방향을 정할 수 있음. 없으면 짧은 쪽
function along(T, a, b, force = 0) {
  const w = T.x1 - T.x0, h = T.y1 - T.y0, P = 2 * w + 2 * h;
  const ta = trackParam(T, a.x, a.y), tb = trackParam(T, b.x, b.y);
  let d = ((tb - ta) % P + P) % P, dir = 1;
  if (force) { dir = force; if (dir < 0) d = (P - d) % P; }
  else if (d > P / 2) { d = P - d; dir = -1; }
  const corners = [[0, T.x0, T.y0], [w, T.x1, T.y0], [w + h, T.x1, T.y1], [2 * w + h, T.x0, T.y1]];
  const pts = corners
    .map(([t, x, y]) => ({ dd: dir > 0 ? ((t - ta) % P + P) % P : ((ta - t) % P + P) % P, x, y }))
    .filter(o => o.dd > 0.01 && o.dd < d - 0.01)
    .sort((p, q) => p.dd - q.dd)
    .map(o => ({ x: o.x, y: o.y }));
  pts.push({ x: b.x, y: b.y });
  return pts;
}
function trackDist(T, a, b) {
  const P = 2 * (T.x1 - T.x0) + 2 * (T.y1 - T.y0);
  const d = ((trackParam(T, b.x, b.y) - trackParam(T, a.x, a.y)) % P + P) % P;
  return Math.min(d, P - d);
}
// 그림 크기에 따른 위치 정보 (게임과 순서 시뮬레이션이 같이 씀)
// 그림과 쇠똥구리 길 사이 여백 (음식 한 칸 크기 단위). 테두리 길을 걷는 쇠똥구리·굴리는 공이
// 가장자리 음식과 겹쳐 "음식을 뚫고 지나가는" 것처럼 보이지 않게 비워 둠.
//  위: 걷는 옆모습 반 높이 + 차선 비킴 ≈ 0.9칸
//  아래: 굴로 돌아올 때 물구나무 선 모습(약 1.7칸 높이)이 그림 쪽으로 솟음 ≈ 1.6칸
//  양옆: 위에서 본 몸 반 폭 + 차선 비킴 ≈ 1.15칸
const EDGE = { t: 1.0, b: 1.7, s: 1.25 }, EDGE_PX = 3;
function geometry(R, C) {
  const cs = Math.floor(Math.min((PIC.w - 2 * EDGE_PX) / (C + 2 * EDGE.s), (PIC.h - 2 * EDGE_PX) / (R + EDGE.t + EDGE.b), 30));
  const top = PIC.y + EDGE_PX + EDGE.t * cs, bot = PIC.y + PIC.h - EDGE_PX - EDGE.b * cs;
  const gx = Math.round(W / 2 - C * cs / 2), gy = Math.round(top + (bot - top - R * cs) / 2);
  return { cs, gx, gy, T: { x0: PIC.x - TRACK_M, y0: PIC.y - TRACK_M, x1: PIC.x + PIC.w + TRACK_M, y1: PIC.y + PIC.h + TRACK_M } };
}
const geoCenter = (geo, r, c) => ({ x: geo.gx + c * geo.cs + geo.cs / 2, y: geo.gy + r * geo.cs + geo.cs / 2 });
function geoEntry(geo, r, c, side) {
  const T = geo.T, p = geoCenter(geo, r, c);
  return side === 'T' ? { x: p.x, y: T.y0 } : side === 'B' ? { x: p.x, y: T.y1 } : side === 'L' ? { x: T.x0, y: p.y } : { x: T.x1, y: p.y };
}
// 집에서 나와 굴을 비켜 길로 올라가는 첫 지점
function startPoints(geo, sx, sy) {
  let dx = sx;
  if (Math.abs(sx - HOLE.x) < HOLE_DETOUR) dx = HOLE.x + (sx >= HOLE.x ? HOLE_DETOUR : -HOLE_DETOUR);
  const T = geo.T, px = Math.max(T.x0, Math.min(T.x1, dx));
  return dx !== sx ? [{ x: dx, y: sy }, { x: px, y: T.y1 }] : [{ x: px, y: T.y1 }];
}
// 후보 경로의 길이 (집 → 길 → 들어가는 지점 → 빈 길로 꺾어서 → 음식)
function candEntry(geo, info, k, cand) {
  const C = info.C, r = Math.floor(k / C), c = k % C;
  if (cand.via < 0) return { E: geoEntry(geo, r, c, cand.side), first: geoCenter(geo, r, c) };
  const rk = info.root[cand.via], rr = Math.floor(rk / C), rc = rk % C;
  return { E: geoEntry(geo, rr, rc, borderSide(rr, rc, info.R, C)), first: geoCenter(geo, rr, rc) };
}
function pathCost(geo, info, sx, sy, k, cand) {
  const sp = startPoints(geo, sx, sy), P1 = sp[sp.length - 1];
  const { E, first } = candEntry(geo, info, k, cand);
  return Math.abs(sx - sp[0].x) + Math.abs(sy - P1.y) + trackDist(geo.T, P1, E) +
    Math.hypot(E.x - first.x, E.y - first.y) + cand.steps * geo.cs;
}
// 실제 이동 경로: 갈 때 꺾임점들 + 돌아올 때 쓸 안쪽 길
function makePath(sx, sy, k, cand) {
  const info = game.reach, C = info.C, T = game.T;
  const sp = startPoints(game, sx, sy), P1 = sp[sp.length - 1];
  const { E } = candEntry(game, info, k, cand);
  const inner = [];   // 길 → 음식 사이 빈칸 중심들
  if (cand.via >= 0) {
    const chain = [];
    for (let n = cand.via; n >= 0; n = info.par[n]) chain.push(n);
    chain.reverse();
    for (const n of chain) { const p = geoCenter(game, Math.floor(n / C), n % C); inner.push(p); }
  }
  const [tx, ty] = cellCenter(Math.floor(k / C), k % C);
  const go = simplify([...sp, ...along(T, P1, E), ...inner, { x: tx, y: ty }]);
  return { go, E, inner };
}
// 일직선 위의 중간 점은 빼서 꺾이는 곳만 남김
function simplify(pts) {
  const out = [];
  for (const p of pts) {
    if (out.length && Math.hypot(out[out.length - 1].x - p.x, out[out.length - 1].y - p.y) < 0.01) continue;
    if (out.length >= 2) {
      const a = out[out.length - 2], b = out[out.length - 1];
      if (Math.abs((b.x - a.x) * (p.y - b.y) - (b.y - a.y) * (p.x - b.x)) < 0.01) out.pop();
    }
    out.push(p);
  }
  return out;
}
// 굴로 돌아가는 길: 가까운 쪽으로 돌아감 (분산은 음식을 왼쪽·오른쪽 번갈아 고르는 것으로 함)
// 굴 앞에서는 들어오는 쪽(왼쪽/오른쪽)에 따라 자리를 나눠 들어감
// 두 방향의 실제 길이를 재서 짧은 쪽을 고름 (굴 바로 앞에서 음식을 들고 나와도 테두리를 한 바퀴 돌지 않게)
// 나가는 곳도 들어온 곳에 묶이지 않음: 음식을 집은 순간의 그림에서 빈 길을 다시 찾아
// "그림 밖으로 나가는 거리 + 테두리를 따라 굴까지 거리"가 가장 짧은 출구로 나감
// (들어올 때는 막혀 있던 가까운 길이 그사이 다른 쇠똥구리가 음식을 먹어 열렸을 수도 있음)
const pathLen = pts => { let s = 0; for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); return s; };
function trackToHole(E) {
  const T = game.T;
  // 굴 바로 위(두 진입 지점 사이)로 나왔으면 테두리를 돌지 않고 곧장 굴로 들어감
  // (안 그러면 어느 방향이든 진입 지점이 등 뒤에 있어서 그림을 한 바퀴 빙 돌아옴)
  if (Math.abs(E.y - T.y1) < 0.5 && Math.abs(E.x - HOLE.x) < 12) {
    const side = E.x >= HOLE.x ? 1 : -1;
    const pts = [E, { x: HOLE.x + side * 6, y: HOLE.y - 2 }, { x: HOLE.x, y: HOLE.y }];
    return { pts, len: pathLen(pts) };
  }
  const route = dir => {
    // 시계 방향(바닥 길을 오른쪽에서 왼쪽으로)은 굴 오른쪽으로, 반시계는 왼쪽으로 들어감
    const side = dir > 0 ? 1 : -1;
    const pts = [E, ...along(T, E, { x: HOLE.x + side * 12, y: T.y1 }, dir), { x: HOLE.x + side * 6, y: HOLE.y - 2 }, { x: HOLE.x, y: HOLE.y }];
    return { pts, len: pathLen(pts) };

  const a = route(1), b = route(-1);
  return a.len <= b.len ? a : b;
}
function backPath(cr) {
  const g = game, R = g.R, C = g.C, N = R * C, start = cr.r * C + cr.c;
  // 집은 자리에서 빈칸으로 넓이 우선 탐색
  const dist = new Int16Array(N).fill(-1), par = new Int32Array(N).fill(-1), q = [start];
  dist[start] = 0;
  for (let i = 0; i < q.length; i++) {
    const k = q[i], r = Math.floor(k / C), c = k % C;
    for (const [dr, dc] of D4) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= R || nc >= C || g.grid[nr][nc]) continue;
      const n = nr * C + nc;
      if (dist[n] >= 0) continue;
      dist[n] = dist[k] + 1; par[n] = k; q.push(n);
    }
  }
  // 가장자리 칸마다 바깥 길로 나가 굴까지 가는 길이를 재서 가장 짧은 출구 선택
  let best = null;
  for (const k of q) {
    const r = Math.floor(k / C), c = k % C;
    const sides = [];
    if (r === 0) sides.push('T');
    if (r === R - 1) sides.push('B');
    if (c === 0) sides.push('L');
    if (c === C - 1) sides.push('R');
    for (const s of sides) {
      const E = geoEntry(g, r, c, s), p = geoCenter(g, r, c);
      const tr = trackToHole(E);
      const len = dist[k] * g.cs + Math.hypot(E.x - p.x, E.y - p.y) + tr.len;
      if (!best || len < best.len) best = { k, tr, len };
    }
  }
  if (!best) return simplify([...cr.inner.slice().reverse(), ...trackToHole(cr.E).pts]);   // 만일을 위한 예전 길
  const chain = [];
  for (let n = best.k; n !== start && n >= 0; n = par[n]) chain.push(geoCenter(g, Math.floor(n / C), n % C));
  chain.reverse();
  return simplify([{ x: cr.x, y: cr.y }, ...chain, ...best.tr.pts]);
}

// 가져올 음식 고르기: side가 -1이면 그림 왼쪽 절반, 1이면 오른쪽 절반에서 가장 가까운 음식.
// 그쪽에 닿을 수 있는 음식이 없으면 반대쪽에서 고름.
// 일터마다 왼쪽·오른쪽을 번갈아 고르면 음식이 양쪽에서 고르게 사라지고 쇠똥구리도 자연스럽게 나뉨
function findTarget(color, sx, sy, side = 0) {
  const info = game.reach, half = game.C / 2;
  let best = null, bd = 1e9, alt = null, ad = 1e9;
  for (const [k, cands] of info.acc) {
    const r = Math.floor(k / game.C), c = k % game.C;
    if (game.grid[r][c] !== color || game.reserved[r][c] || game.ice.has(k)) continue;
    const mine = !side || (side < 0 ? c < half : c >= half);
    for (const cand of cands) {
      const d = pathCost(game, info, sx, sy, k, cand);
      if (mine) { if (d < bd) { bd = d; best = { k, r, c, cand }; } }
      else if (d < ad) { ad = d; alt = { k, r, c, cand }; }
    }
  }
  best = best || alt;
  if (best) best.path = makePath(sx, sy, best.k, best.cand);
  return best;
}
function hasTarget(color) {
  for (const k of game.reach.acc.keys()) {
    const r = Math.floor(k / game.C), c = k % game.C;
    if (game.grid[r][c] === color && !game.reserved[r][c] && !game.ice.has(k)) return true;
  }
  return false;
}

// 음식 칸이 없어진 뒤 (쇠똥구리가 집었거나 폭탄): 옆 얼음 깨기, 🔑 자물쇠 열기, 🎁 선물
function onCellGone(r, c) {
  const g = game, k = r * g.C + c;
  g.ice.delete(k);
  for (const [dr, dc] of D4) {
    const n = (r + dr) * g.C + (c + dc);
    if (r + dr < 0 || c + dc < 0 || r + dr >= g.R || c + dc >= g.C || !g.ice.has(n)) continue;
    g.ice.delete(n);
    const [x, y] = cellCenter(r + dr, c + dc);
    burst(x, y, '#e8f8ff', 7, 90); burst(x, y, '#9fd8ff', 4, 60);
    if (ac) try { crunch(ac.currentTime, 0.06, 3200, 0.12); } catch (e) {}
  }
  const [x, y] = cellCenter(r, c);
  if (g.keys.has(k)) { g.keys.delete(k); openLock(x, y, 'key'); }
  if (g.gifts.has(k)) {
    g.gifts.delete(k);
    const G = BAL.gimmicks && BAL.gimmicks.gift, list = (G && G.rewards) || ['undo'];
    if (mode === 'solo') {
      const pick = list[Math.floor(Math.random() * list.length)], B = BAL.boosters[pick];
      giveBooster({ [pick]: 1 });
      g.pops.push({ x, y, t: 0, text: `🎁 ${B.icon} ${B.name}`, color: '#ff8fbf' });
      g.banner = { text: '🎁 선물!', sub: `${B.icon} ${B.name} 부스터를 받았어요 (가방에 보관)`, color: '#ffc0dc', t: 1.6 };
      melody([784, 988, 1175, 1568], 80, 0.05); vibrate(60);
    }
  }
}
// 자물쇠 하나 열기 (🔑 음식을 먹었거나 🔓 열쇠 부스터)
function openLock(x, y, why) {
  const g = game, L = g.locks.find(l => !l.open);
  if (!L) return false;
  L.open = true;
  let p;
  if (L.type === 'slot') { g.locked[L.slot] = false; p = slotCenter(L.slot); }
  else { g.lockedCol = -1; p = { x: colX(L.col), y: qPosY(0) }; }
  burst(p.x, p.y, '#ffd84a', 18, 100); burst(p.x, p.y, '#ffffff', 8, 70);
  if (why === 'key') {
    g.pops.push({ x, y, t: 0, text: '🔑 열쇠!', color: '#ffd84a' });
    g.banner = { text: '🔑 철컥!', sub: L.type === 'slot' ? '잠긴 일터 한 칸이 열렸어요' : '잠긴 대기열 줄이 풀렸어요', color: '#ffe48a', t: 1.6 };
    melody([523, 784, 1046, 1318], 70, 0.05); vibrate(70);
  }
  return true;
}
function freeSlots() { const f = []; game.slots.forEach((s, k) => { if (!s && !game.locked[k]) f.push(k); }); return f; }

function tryPick(c, i) {
  const a = game.queues[c][i];
  if (i > 0) { a.shake = 0.4; toast('맨 위에 있는 쇠똥구리만 고를 수 있어요'); beep(160, 0.1, 0.03); return; }
  if (c === game.lockedCol) { a.shake = 0.4; toast('⛓ 잠긴 줄이에요. 그림 속 🔑을 먹으면 풀려요'); beep(160, 0.1, 0.03); return; }
  const members = a.group ? a.group.members.slice() : [a];
  if (a.group && !members.every(m => game.queues[m.col][0] === m)) {
    members.forEach(m => m.shake = 0.4);
    toast('사슬로 묶인 둘이 모두 맨 위에 있어야 해요');
    beep(160, 0.1, 0.03);
    return;
  }
  const free = freeSlots();
  if (free.length < members.length) {
    members.forEach(m => m.shake = 0.4);
    toast(members.length > 1 ? `빈 자리가 ${members.length}칸 필요해요` : '일터에 빈 자리가 없어요');
    beep(160, 0.1, 0.03);
    return;
  }
  members.sort((p, q) => p.col - q.col).forEach((m, k) => {
    game.queues[m.col].shift();
    m.inSlot = true; m.slot = free[k]; m.cool = 0.2; m.owner = game.turn;
    game.slots[free[k]] = m;
  });
  if (mode === 'coop') game.turn ^= 1;   // 협동: 고를 때마다 차례가 바뀜
  beep(520 + members.length * 120, 0.08, 0.04);
}

function canPickAny() {
  const free = freeSlots().length;
  if (!free) return false;
  for (let c = 0; c < 3; c++) {
    const a = game.queues[c][0];
    if (!a || c === game.lockedCol) continue;
    if (!a.group) return true;
    const ms = a.group.members;
    if (ms.every(m => game.queues[m.col][0] === m) && free >= ms.length) return true;
  }
  return false;
}
function slotCanWork() { return game.slots.some(s => s && hasTarget(s.color)); }

function burst(x, y, color, n, sp = 90) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * PI * 2, v = sp * (0.4 + Math.random() * 0.8);
    game.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, life: 0.4 + Math.random() * 0.3, color, s: 3 });
  }
}
function startClear() {
  if (mode === 'versus') { netSend({ t: 'vs', kind: 'clear' }); endVersus(true, '먼저 다 먹었어요'); return; }
  game.state = 'clear'; overlay = 'clear'; clearT = 0;
  if (online()) netSend({ t: 'end', kind: 'clear', score: game.score });
  makeConfetti();
  firstClear(game.idx);
  melody([523, 659, 784, 1046, 1318], 110, 0.05);
  vibrate(80);
}
function makeConfetti() {
  confetti = [];
  const cols = ['#ef4f5a', '#ffd84a', '#5cc45a', '#4a82e8', '#ff8fbf', '#a66be6', '#ff9a3c'];
  for (let i = 0; i < 90; i++) confetti.push({
    x: Math.random() * W, y: -20 - Math.random() * 400, vy: 60 + Math.random() * 90,
    sw: Math.random() * PI * 2, c: cols[i % cols.length], s: 4 + (i % 3) * 2
  });
}
// 경쟁 결과 (won: 내가 이겼는지)
function endVersus(won, note) {
  if (!game || game.state === 'over') return;
  vsWin = won; if (note) vsNote = note;
  game.state = 'over';
  overlay = 'vsEnd'; clearT = 0;
  if (won) makeConfetti(); else confetti = [];
  if (won && game.remaining === 0) firstClear(game.idx);
  melody(won ? [523, 659, 784, 1046] : [392, 330, 262], 110, 0.05);
  vibrate(80);
}

// ================== 업데이트 ==================
function update(dt) {
  time += dt;
  if (toastMsg) { toastMsg.t -= dt; if (toastMsg.t <= 0) toastMsg = null; }
  if (overlay === 'clear' || overlay === 'vsEnd') {
    clearT += dt;
    for (const p of confetti) { p.y += p.vy * dt; p.sw += dt * 4; if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; } }
  }
  if (screen !== 'play' || !games.length) return;
  game = games[0];
  if ((overlay === 'items' || overlay === 'bag' || overlay === 'intro') && !online()) return;   // 혼자 할 때 도감을 보는 동안은 잠깐 멈춤
  if (game.mirror) updateMirror(dt); else updateGame(dt);
  // 온라인: 협동 방장은 상태를, 경쟁은 내 진행도를 보냄
  if (online()) {
    net.sendT = (net.sendT || 0) + dt;
    if (mode === 'coop' && net.role === 'host' && net.sendT >= 0.1) { net.sendT = 0; netSend(makeSnap()); }
    if (mode === 'versus' && net.sendT >= 0.4) { net.sendT = 0; netSend({ t: 'prog', rem: game.remaining, total: game.total }); }
  }
}
const SAFE_EXIT = () => beetlePx() * 15 + 2;   // 집에서 막 나간 쇠똥구리가 이만큼 멀어져야 다음이 출발
// 안전거리: 같은 방향으로 가는 앞 쇠똥구리와 SAFE보다 가까워지지 않게, 갈 수 있는 거리를 줄임
// (마주 오는 쇠똥구리는 길 양쪽으로 비켜 지나가고, 목적지 바로 앞에서는 기다리지 않음)
function roomAhead(cr, SAFE) {
  const t = cr.pts[cr.i];
  if (!t) return Infinity;
  const fx = t.x - cr.x, fy = t.y - cr.y, fd = Math.hypot(fx, fy);
  if (fd < 0.01) return Infinity;
  const last = cr.pts[cr.pts.length - 1];
  if (cr.i === cr.pts.length - 1 && fd < SAFE) return Infinity;   // 음식·굴 바로 앞
  const ux = fx / fd, uy = fy / fd;
  const nearHole = p => Math.hypot(p.x - HOLE.x, p.y - HOLE.y) < 30;
  if (nearHole(cr) || Math.hypot(last.x - cr.x, last.y - cr.y) < SAFE) return Infinity;
  let room = Infinity;
  for (const o of game.carriers) {
    if (o === cr || o.done || o.state !== cr.state || nearHole(o)) continue;   // 같은 일(가지러/굴려 오기)끼리만, 굴 입구는 예외
    const ox = o.x - cr.x, oy = o.y - cr.y;
    const ahead = ox * ux + oy * uy, side = Math.abs(ox * uy - oy * ux);
    if (ahead <= 0 || ahead > SAFE * 2 || side > SAFE * 0.5) continue;
    // 거의 같은 방향으로 가는 앞 쇠똥구리만 (마주 오거나 꺾어 나가는 건 그냥 지나감)
    if (Math.cos(o.ang - cr.ang) < 0.85) continue;
    room = Math.min(room, Math.max(0, ahead - SAFE));
  }
  return room;
}
// 화면 위치를 부드럽게 따라가는 부분 (방장·손님 공통)
function animateLocal(dt) {
  if (game.toast) { game.toast.t -= dt; if (game.toast.t <= 0) game.toast = null; }
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }
  for (const p of game.pops) p.t += dt;
  game.pops = game.pops.filter(p => p.t < 1.4);
  const k = Math.min(1, dt * 11);
  game.queues.forEach((q, c) => q.forEach((a, i) => { a.tx = colX(c); a.ty = qPosY(i); }));
  game.slots.forEach((a, s) => { if (a) { const p = slotCenter(s); a.tx = p.x; a.ty = p.y; } });
  for (const a of [...game.queues.flat(), ...game.slots.filter(Boolean)]) {
    a.x += (a.tx - a.x) * k; a.y += (a.ty - a.y) * k;
    if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
  }
  for (const p of game.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  game.particles = game.particles.filter(p => p.life > 0);
}
// 협동 손님: 방장이 보낸 위치로 쇠똥구리를 부드럽게 옮기기만 함
function updateMirror(dt) {
  animateLocal(dt);
  const k = Math.min(1, dt * 10);
  for (const cr of game.carriers) {
    if (cr.tx === undefined) continue;
    const moving = Math.hypot(cr.tx - cr.x, cr.ty - cr.y) > 0.5;
    cr.x += (cr.tx - cr.x) * k; cr.y += (cr.ty - cr.y) * k;
    cr.roll += ((cr.troll || 0) - cr.roll) * k;
    if (moving) cr.walk += dt * speed;
  }
}
function updateGame(dt) {
  const sdt = dt * speed;   // 배속 적용
  for (const f in game.fx) game.fx[f] = Math.max(0, game.fx[f] - sdt);
  animateLocal(dt);
  // 일터 쇠똥구리가 자기 집에서 일꾼 쇠똥구리를 내보냄
  if (game.state === 'play') {
    const gap = DISPATCH_GAP;
    game.slots.forEach((a, s) => {
      if (!a || Math.hypot(a.tx - a.x, a.ty - a.y) > 4) return;
      a.cool -= sdt;
      while (a.cool <= 0) {
        const h = homePos(s);
        // 집 앞이 붐비면 잠깐 기다렸다가 출발 (길에 쇠똥구리가 너무 많이 몰리지 않게)
        if (game.carriers.some(o => o.state === 'go' && Math.hypot(o.x - h.x, o.y - h.y) < SAFE_EXIT())) { a.cool = 0; return; }
        a.side = a.side === -1 ? 1 : -1;   // 이번엔 왼쪽, 다음엔 오른쪽 음식
        const t = findTarget(a.color, h.x, h.y, a.side);
        if (!t) { a.side = -a.side; a.cool = 0; return; }
        game.reserved[t.r][t.c] = true;
        game.carriers.push({ id: ++game.crSeq, color: a.color, owner: a.owner, x: h.x, y: h.y, r: t.r, c: t.c, E: t.path.E, inner: t.path.inner,
          pts: t.path.go, i: 0, state: 'go', walk: Math.random(), ang: -PI / 2, roll: 0, lag: -a.cool });
        a.dispatched++; a.cool += gap;
        if (a.dispatched >= a.total) {          // 다 보냈으면 바로 사라짐
          game.slots[s] = null;
          burst(a.x, a.y, '#ffffff', 10, 70);
          beep(880, 0.06, 0.03);
          return;
        }
      }
    });
  }

  const mul = (game.fx.speed > 0 ? 2 : 1) * (game.fx.slow > 0 ? 0.5 : 1);
  const SAFE = beetlePx() * 15 + 5;   // 앞 쇠똥구리와 지킬 거리 (몸길이 + 여유)
  for (const cr of game.carriers) {
    // 이번 프레임 중간에 출발한 쇠똥구리는 출발 후 지난 시간만큼만 움직임
    let step = SPEED * mul * (cr.lag !== undefined ? Math.min(cr.lag, sdt) : sdt);
    // 앞 쇠똥구리와 거리 유지. 단, 좁은 길에서 서로 기다리느라 0.8초 넘게 멈춰 있으면 양보 없이 지나감 (교통 체증 교착 방지)
    if (cr.passT > 0) cr.passT -= sdt;
    const room = cr.passT > 0 ? Infinity : roomAhead(cr, SAFE);
    cr.waitT = room <= 0.01 && step > 0 ? (cr.waitT || 0) + sdt : 0;
    if (cr.waitT > 0.8) { cr.passT = 0.6; cr.waitT = 0; }
    step = Math.min(step, room);
    delete cr.lag;
    cr.walk += sdt * mul;
    if (cr.state === 'back' && Math.random() < Math.min(1, sdt * 4)) {
      const ux = Math.cos(cr.ang);
      game.particles.push({ x: cr.x - ux * 4 + (Math.random() * 8 - 4), y: cr.y + ballR() - 1,
        vx: -ux * 20 + (Math.random() * 16 - 8), vy: -25 - Math.random() * 20, life: 0.35, color: '#cfae80', s: 3 });
    }
    while (step > 0 && !cr.done) {
      const t = cr.pts[cr.i];
      const dx = t.x - cr.x, dy = t.y - cr.y, d = Math.hypot(dx, dy);
      if (d > 0.01) cr.ang = Math.atan2(dy, dx);
      if (d > step) {
        cr.x += dx / d * step; cr.y += dy / d * step;
        if (cr.state === 'back') cr.roll += step;
        step = 0;
      } else {
        cr.x = t.x; cr.y = t.y; step -= d;
        if (cr.state === 'back') cr.roll += d;
        if (++cr.i < cr.pts.length) continue;
        if (cr.state === 'go') {
          const key = cr.r * game.C + cr.c;
          game.grid[cr.r][cr.c] = null;
          game.reserved[cr.r][cr.c] = false;
          clearCell(cr.r, cr.c);
          game.reach = reachMap(game.grid);
          game.remaining--;
          onCellGone(cr.r, cr.c);
          if (game.items.has(key)) {   // 숨은 아이템: 집는 순간 이 자리에서 발동
            const type = game.items.get(key); game.items.delete(key);
            cr.item = type;
            activateItem(type, cr.x, cr.y, cr.r, cr.c);
          }
          cr.state = 'back'; cr.pts = backPath(cr); cr.i = 0;
          vibrate(12);   // 안드로이드: 짧은 진동
          pickSound();   // 아이폰 등 진동이 안 되는 폰: 작은 '톡' 소리
        } else {
          cr.done = true;
          game.score[cr.owner || 0]++;
          burst(HOLE.x, HOLE.y - 4, COLORS[cr.color], 3);
          if (time - lastBeep > 0.05) { lastBeep = time; beep(1100 + Math.random() * 300, 0.03, 0.015); }
        }
      }
    }
  }
  game.carriers = game.carriers.filter(c => !c.done);

  if (game.state === 'play') {
    if (game.remaining === 0 && game.carriers.length === 0) {
      game.endT += dt;
      if (game.endT > 0.4) startClear();
    } else {
      const busy = game.carriers.length > 0 ||
        game.slots.some(s => s && Math.hypot(s.tx - s.x, s.ty - s.y) > 4);
      if (!busy && !slotCanWork() && !canPickAny()) {
        game.stuckT += dt;
        if (game.stuckT > 0.9) {
          if (mode === 'versus') { netSend({ t: 'vs', kind: 'stuck' }); endVersus(false, '일터가 꽉 막혔어요'); }
          else {
            game.state = 'fail'; overlay = 'fail'; melody([392, 330, 262], 150, 0.05);
            if (online()) netSend({ t: 'end', kind: 'fail' });
          }
        }
      } else game.stuckT = 0;
    }
  }
}

// ================== 그리기 도우미 (도트 UI) ==================
function text(t, x, y, size, color, align = 'center', stroke = null) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  x = Math.round(x); y = Math.round(y);
  if (stroke) {
    ctx.fillStyle = stroke;
    const o = Math.max(1, Math.round(size / 10));
    for (const [dx, dy] of [[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o]]) ctx.fillText(t, x + dx, y + dy);
  }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function fitSize(t, maxW, size, min = 10) {
  for (let s = size; s > min; s -= 1) { ctx.font = `${s}px ${FONT}`; if (ctx.measureText(t).width <= maxW) return s; }
  return min;
}
function pxBox(x, y, w, h, fill, border = OUTLINE, u = 3) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = border;
  ctx.fillRect(x + u, y, w - 2 * u, h);
  ctx.fillRect(x, y + u, w, h - 2 * u);
  ctx.fillStyle = fill;
  ctx.fillRect(x + u, y + u, w - 2 * u, h - 2 * u);
}
function button(x, y, w, h, label, fn, color = '#ffcf4a', tc = '#3a2412', size = 16) {
  pxBox(x, y + 4, w, h, OUTLINE);
  pxBox(x, y, w, h, color);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(Math.round(x + 6), Math.round(y + 6), Math.round(w - 12), 3);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(Math.round(x + 3), Math.round(y + h - 6), Math.round(w - 6), 3);
  text(label, x + w / 2, y + h / 2, size, tc);
  btns.push({ x, y, w, h, fn, inst: curInst });
}
function pxStar(x, y, s, color) {
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = color;
  ctx.fillRect(x - s, y - s * 3, s * 2, s * 6);
  ctx.fillRect(x - s * 3, y - s, s * 6, s * 2);
  ctx.fillRect(x - s * 2, y - s * 2, s * 4, s * 4);
}

function drawClear() {
  const t = clearT, g = game;
  const last = g.idx === BASE_COUNT - 1, custom = g.idx >= BASE_COUNT;
  ctx.fillStyle = `rgba(30,18,40,${Math.min(0.85, t * 1.6)})`; ctx.fillRect(0, 0, W, H);
  if (t > 0.2) drawRays(W / 2, 330, Math.min(0.25, (t - 0.2) * 0.5));
  // 완성 그림 대신: 신난 쇠똥구리가 음식 공을 굴리며 축하 (반짝이 별이 둘레에서 깜빡)
  const k = Math.min(1, t / 0.6), e = easeBack(k);
  const bx = W / 2, byy = 340 - 30 * e;
  const fr = Math.floor(time * 8) % 2;
  ctx.globalAlpha = Math.min(1, k * 1.5);
  drawFoodBall(bx + 22, byy + 6, 16, 'R', time * 4);
  drawSprite('beetlePush' + fr, 'Y', 0, 4, bx - 26, byy, Math.min(1, k * 1.5));
  ctx.globalAlpha = 1;
  if (t > 0.5) for (let i = 0; i < 8; i++) {
    const a = i / 8 * PI * 2 + 0.3;
    const tw = Math.sin(time * 6 + i * 1.7);
    if (tw > -0.2) pxStar(bx + Math.cos(a) * 110, byy + Math.sin(a) * 80, tw > 0.5 ? 3 : 2, i % 2 ? '#fff6a0' : '#ffffff');
  }
  drawConfetti();
  if (t > 0.6) {
    const bt = Math.min(1, (t - 0.6) / 0.4);
    const size = Math.round(28 * (0.6 + 0.4 * easeBack(bt)));
    text(custom ? '내 사진 완성!' : last ? '모든 스테이지 클리어!' : '냠냠! 클리어!', W / 2, 446, size, '#ffe08a', 'center', OUTLINE);
    const sub = mode === 'coop' ? `팀워크 최고! 방장 ${g.score[0]}개 · 친구 ${g.score[1]}개` : `'${STAGES[g.idx].name}' 을(를) 다 먹었어요`;
    text(sub, W / 2, lastGift ? 474 : 484, 14, '#ffffff', 'center', OUTLINE);
    if (lastGift) { const gt = '🎁 선물: ' + lastGift.join(', '); text(gt, W / 2, 498, fitSize(gt, W - 40, 15, 10), '#ffe08a', 'center', OUTLINE); }
  }
  if (t > 1.0) {
    if (online()) {
      if (net.role === 'host' && !last) button(W / 2 - 100, 516, 200, 54, '다음 스테이지 ▶', () => netStartGame(g.idx + 1));
      else if (net.role !== 'host') text('방장이 다음 스테이지를 고르는 중…', W / 2, 540, 14, '#ffe7a3', 'center', OUTLINE);
      button(W / 2 - 70, 586, 140, 44, '나가기', leaveOnline, '#e8dcc4', '#3a2412', 16);
    } else {
      if (custom) button(W / 2 - 100, 516, 200, 54, '📷 다른 사진으로', pickPhoto, '#ffb0d0');
      else if (!last) button(W / 2 - 100, 516, 200, 54, '다음 스테이지 ▶', () => startStage(g.idx + 1));
      button(W / 2 - 70, last ? 524 : 586, 140, 44, '목록으로', goMenu, '#e8dcc4', '#3a2412', 16);
    }
  }
}
// 경쟁 결과 (내 폰 기준)
function drawVsEnd() {
  const t = clearT, win = vsWin;
  ctx.fillStyle = `rgba(30,18,40,${Math.min(0.75, t * 1.6)})`; ctx.fillRect(0, 0, W, H);
  if (win) { drawRays(W / 2, 300, Math.min(0.25, t * 0.5)); drawConfetti(); }
  const k = Math.min(1, t / 0.5);
  pxBox(50, 220, W - 100, 180, OUTLINE, OUTLINE, 4);
  pxBox(50, 214, W - 100, 180, win ? '#ffe08a' : '#d8d0c4', OUTLINE, 4);
  text(win ? '승리!' : '아쉬워요', W / 2, 262, Math.round(36 * (0.6 + 0.4 * easeBack(k))), win ? '#c2561b' : '#5c4a38');
  text(vsNote || (win ? '먼저 다 먹었어요' : '상대가 먼저 다 먹었어요'), W / 2, 306, 14, '#3a2412');
  drawSprite('beetlePush' + (Math.floor(time * 6) % 2), win ? 'Y' : 'A', 0, 3, W / 2 - 16, 356);
  drawFoodBall(W / 2 + 14, 360, 9, win ? 'R' : 'A', time * 3);
  if (t > 0.8) {
    if (online() && net.role === 'host') button(W / 2 - 90, 420, 180, 50, '다시 대결', () => netStartGame(game.idx), '#ffd34d');
    else if (online()) text('방장이 다시 시작할 수 있어요', W / 2, 444, 14, '#ffe7a3', 'center', OUTLINE);
    button(W / 2 - 70, 484, 140, 44, '나가기', leaveOnline, '#e8dcc4', '#3a2412', 16);
  }
}
// 온라인 방 (로비)
function drawLobby() {
  panel(150, 470);
  text(MODE_LABEL[mode], W / 2, 186, 24, '#3a2412');
  const name = `${lobby.stage + 1}. ${STAGES[lobby.stage].name}`;
  text(`방장이 되면 '${name}' 으로 시작해요`, W / 2, 216, fitSize(`방장이 되면 '${name}' 으로 시작해요`, 330, 13), '#5c4a38');
  button(70, 240, 280, 52, '⚡ 빠른 매칭 (들어온 순서대로)', quickMatch, '#ffd34d', '#3a2412', 15);
  button(70, 304, 280, 46, '🏠 방 만들기 (번호 받기)', createRoom, '#9fe08a', '#3a2412', 15);
  button(70, 362, 280, 46, '🔑 방 번호로 들어가기', joinRoom, '#bfe6ff', '#3a2412', 15);
  // 상태 안내 (기다리는 중이면 점이 움직임)
  const busy = net && !online();
  const dots = busy ? '.'.repeat(1 + Math.floor(time * 2) % 3) : '';
  const lines = wrapText(lobby.status + dots, 300, 14);
  lines.forEach((l, i) => text(l, W / 2, 438 + i * 22, 14, '#3a2412'));
  if (net && net.code && !online()) text(net.code, W / 2, 512, 40, '#c2561b', 'center', OUTLINE);
  button(W / 2 - 60, 556, 120, 44, '취소', () => { netClose(); lobby = null; overlay = null; }, '#e8dcc4', '#3a2412', 16);
}
function wrapText(t, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const out = []; let line = '';
  for (const ch of t) {
    if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ''; }
    line += ch;
  }
  if (line) out.push(line);
  return out.slice(0, 3);
}
function drawOverlay() {
  if (overlay === 'help') {
    panel(90, 610);
    text('게임 방법', W / 2, 126, 24, '#3a2412');
    const lines = [
      ['b', '위 그림은 네모난 음식 조각이에요.'],
      ['a', '아래 3줄의 맨 위 쇠똥구리를 눌러'],
      ['', '일터(5칸)로 보내요.'],
      ['c', '숫자만큼 일꾼이 집에서 나와 그림판'],
      ['', '가장자리를 돌다 빈 길로 꺾어 들어가'],
      ['', '같은 색 음식을 가져와요.'],
      ['', '집은 음식은 동그랗게 굴려서 굴로 쏙!'],
      ['l', '사슬로 묶인 둘은 함께 맨 위에 있어야 해요.'],
      ['i', '🎒 부스터: 클리어 선물로 모아 막힐 때 써요'],
      ['m', '모드 버튼: 혼자 / 협동 온라인 / 경쟁 온라인'],
      ['', '협동: 각자 폰으로 한 그림을 번갈아 골라요'],
      ['', '경쟁: 각자 폰으로 같은 그림 먼저 먹기 대결'],
      ['p', '📷 내 사진으로: 사진을 도트 음식으로 바꿔서 플레이'],
      ['s', '배속 버튼: 1·2·3·5·9배속'],
      ['x', '일터가 꽉 막히면 실패! ⚠🔥 허들엔 🔑🧊⛓🎁 기믹'],
      ['o', '음식을 다 옮기면 클리어!'],
    ];
    lines.forEach(([ic, t], i) => {
      const y = 162 + i * 29;
      if (ic === 'a') drawSprite('beetle0', 'R', 0, 1.4, 62, y);
      else if (ic === 'c') drawSprite('beetleWalk0', 'B', 0, 1.6, 62, y);
      else if (ic === 'b') paintSquare(ctx, 54, y - 8, 16, 16, 'Y');
      else if (ic === 'l') { ctx.fillStyle = '#9aa2b0'; ctx.fillRect(52, y - 2, 20, 4); }
      else if (ic === 'i') text('⚡', 62, y, 16, '#d08a20');
      else if (ic === 'm') text('👥', 62, y, 14, '#3a2412');
      else if (ic === 'p') { paintBead(ctx, 54, y - 8, 16, 'K'); }
      else if (ic === 's') text('»', 62, y, 16, '#d08a20');
      else if (ic === 'x') text('✕', 62, y, 16, '#d0453a');
      else if (ic === 'o') text('★', 62, y, 16, '#e0a020');
      text(t, 84, y, fitSize(t, 300, 14, 10), '#3a2412', 'left');
    });
    button(W / 2 - 170, 640, 160, 46, '⚡ 아이템 보기', () => openItems('help'), '#bfe6ff', '#3a2412', 15);
    button(W / 2 + 10, 640, 160, 46, '알겠어요!', () => { overlay = null; });
  } else if (overlay === 'items') {
    drawItems();
  } else if (overlay === 'intro') {
    drawIntro();
  } else if (overlay === 'bag') {
    drawBag();
  } else if (overlay === 'clear') {
    drawClear();
  } else if (overlay === 'vsEnd') {
    drawVsEnd();
  } else if (overlay === 'lobby') {
    drawLobby();
  } else if (overlay === 'fail') {
    panel(220, 340);
    text('쇠똥구리들이 꼼짝 못 해요!', W / 2, 266, 20, '#b33a2a');
    text('일터가 꽉 차서 더 옮길 수 없어요.', W / 2, 300, 14, '#3a2412');
    drawSprite('beetle' + (Math.floor(time * 4) % 2), 'R', 0, 3, W / 2, 352);
    if (online()) {
      if (net.role === 'host') button(W / 2 - 80, 400, 160, 50, '다시 하기', () => netStartGame(game.idx));
      else text('방장이 다시 시작할 수 있어요', W / 2, 424, 14, '#5c4a38');
      button(W / 2 - 70, 462, 140, 42, '나가기', leaveOnline, '#e8dcc4', '#3a2412', 16);
    } else {
      // 혼자 하기: 아껴 둔 부스터로 이어하기
      const opts = mode === 'solo' ? (BAL.boosterOrder || []).filter(k => !boosterBlock(k)) : [];
      if (opts.length) {
        text('🎒 아껴 둔 부스터로 이어할까요?', W / 2, 384, 13, '#3a2412');
        const bw = Math.min(150, (W - 90) / opts.length - 6), x0 = W / 2 - (opts.length * (bw + 6) - 6) / 2;
        opts.forEach((k, i) => { const B = BAL.boosters[k]; const l = `${B.icon} ${B.name} ${inventory[k]}`; button(x0 + i * (bw + 6), 398, bw, 40, l, () => useBooster(k), B.color, '#3a2412', fitSize(l, bw - 8, 13, 9)); });
      }
      const oy = opts.length ? 450 : 400;
      button(W / 2 - 80, oy, 160, 46, '다시 하기', () => startStage(game.idx));
      button(W / 2 - 70, oy + 56, 140, 40, '목록으로', goMenu, '#e8dcc4', '#3a2412', 16);
    }
  }
}

function drawToast() {
  if (!toastMsg) return;
  ctx.font = `14px ${FONT}`;
  const w = Math.min(W - 30, ctx.measureText(toastMsg.text).width + 36);
  ctx.globalAlpha = Math.min(1, toastMsg.t * 3);
  pxBox(W / 2 - w / 2, 448, w, 40, '#2a1a10', OUTLINE, 3);
  text(toastMsg.text, W / 2, 468, 14, '#ffffff');
  ctx.globalAlpha = 1;
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
  cvs.width = Math.round(W * s * dpr);
  cvs.height = Math.round(H * s * dpr);
  RES = s * dpr;
  mainCtx.setTransform(RES, 0, 0, RES, 0, 0);
  mainCtx.imageSmoothingEnabled = false;
  spriteCache.clear(); thumbCache.clear(); hiresCache.clear(); beadCache.clear(); squareCache.clear(); layers = {};
  const cur = game;
  for (const gm of games) { game = gm; buildPicCache(); }
  game = cur;
}
window.addEventListener('resize', resize);

// ================== 치트: 모든 그림 열기 ==================
// 확인용. 저장된 진행도는 그대로 두고, 이번 실행 동안만 메뉴의 잠긴 스테이지를 모두 엶 (다시 하면 꺼짐)
//  PC: 키보드로 o-p-e-n 입력
//  폰: 메뉴 제목을 2초 안에 5번 톡톡 → 뜨는 입력창(폰 키보드)에 open 입력
let cheatAll = false, cheatKeys = '', cheatTaps = [], cheatAsk = false;
function askCheatCode() {
  const code = window.prompt('치트 코드를 입력하세요');
  if (code == null) return;
  if (code.trim().toLowerCase() === 'open') toggleCheatAll();
  else { toast('코드가 틀렸어요'); beep(160, 0.1, 0.03); }
}
function toggleCheatAll() {
  cheatAll = !cheatAll;
  toast(cheatAll ? '🔓 치트: 모든 그림 열림' : '🔒 치트 꺼짐');
  beep(cheatAll ? 880 : 330, 0.12, 0.04);
}
window.addEventListener('keydown', e => {
  if (e.key.length !== 1) return;
  cheatKeys = (cheatKeys + e.key.toLowerCase()).slice(-4);
  if (cheatKeys === 'open') { cheatKeys = ''; toggleCheatAll(); }
});

// ================== 입력 ==================
function toScreen(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
// 사진 고르기 창은 click 이벤트 안에서 열어야 모바일(특히 아이폰)에서도 열림
cvs.addEventListener('click', () => {
  if (cheatAsk) { cheatAsk = false; askCheatCode(); return; }   // 입력창(폰 키보드)도 click 안에서 열어야 잘 뜸
  if (!photoWanted) return;
  photoWanted = false;
  photoInput.click();
});
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  userTapped = true;
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  else if (ac.state === 'suspended') ac.resume();
  const s = toScreen(e);
  if (screen === 'menu' && !overlay && s.x >= 30 && s.x <= 390 && s.y >= 14 && s.y <= 98) {   // 제목 5번 톡톡 = 치트 코드 입력창
    const now = performance.now();
    cheatTaps = cheatTaps.filter(t => now - t < 2000); cheatTaps.push(now);
    if (cheatTaps.length >= 5) { cheatTaps = []; cheatAsk = true; }
    return;
  }
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (s.x >= b.x && s.x <= b.x + b.w && s.y >= b.y && s.y <= b.y + b.h + 4) { beep(660, 0.05, 0.03); b.fn(); return; }
  }
  if (overlay || screen !== 'play' || !games.length) return;
  game = games[0];
  if (!game || game.state !== 'play') return;
  if (game.aim === 'bomb') { placeBomb(s.x, s.y); return; }
  for (let c = 0; c < 3; c++) {
    const q = game.queues[c];
    for (let i = 0; i < q.length; i++) {
      const a = q[i];
      if (Math.abs(s.x - a.x) < Q.colW / 2 && Math.abs(s.y - a.y) < Q.rowH / 2) {
        if (mode === 'coop' && online()) {
          if (game.turn !== game.player) { toast('지금은 친구 차례예요'); beep(160, 0.1, 0.03); return; }
          if (i > 0) { a.shake = 0.4; toast('맨 위에 있는 쇠똥구리만 고를 수 있어요'); return; }
          if (net.role === 'guest') { netSend({ t: 'pick', c }); beep(520, 0.06, 0.03); return; }   // 방장에게 부탁
        }
        tryPick(c, i);
        return;
      }
    }
  }
});

// ================== 루프 ==================
resize();
if (document.fonts && document.fonts.load) document.fonts.load(`16px DungGeunMo`).catch(() => {});
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));   // 첫 프레임 시각이 시작보다 이를 수 있어서 음수 방지
  last = now;
  update(dt);
  btns = [];
  ctx.setTransform(RES, 0, 0, RES, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (screen === 'menu') {
    curInst = null;
    ctx.drawImage(layer('ground', drawGround), 0, 0, W, H);
    drawMenu();
  } else {
    game = games[0]; curInst = null;
    ctx.drawImage(layer('play', drawPlayStatic), 0, 0, W, H);
    drawPlay();
  }
  if (overlay) btns = [];
  drawToast();
  drawOverlay();
  requestAnimationFrame(frame);
}
goMenu();
requestAnimationFrame(frame);
</script>
