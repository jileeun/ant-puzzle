const shadeMemo = {};
function shade(hex, amt) {
  const key = hex + amt;
  if (shadeMemo[key]) return shadeMemo[key];
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return (shadeMemo[key] = `rgb(${r|0},${g|0},${b|0})`);
}
function hexRgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// ================== 그림 처리: 확대 + 검은 테두리 ==================
const MAX_C = 42, MAX_R = 34;
function parseArt(art) {
  const rows = art.length, cols = Math.max(...art.map(s => s.length));
  const g = [];
  for (let r = 0; r < rows; r++) {
    g.push([]);
    for (let c = 0; c < cols; c++) {
      const ch = art[r][c] || '.';
      g[r].push(ch === '.' || ch === ' ' ? null : ch);
    }
  }
  return g;
}
function addOutline(base) {
  const R0 = base.length, C0 = base[0].length;
  const g = Array.from({ length: R0 + 2 }, () => Array(C0 + 2).fill(null));
  for (let r = 0; r < R0; r++) for (let c = 0; c < C0; c++) g[r + 1][c + 1] = base[r][c];
  const out = g.map(r => r.slice());
  for (let r = 0; r < g.length; r++) for (let c = 0; c < g[0].length; c++) {
    if (g[r][c]) continue;
    let near = false;
    for (let dr = -1; dr <= 1 && !near; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < g.length && nc < g[0].length && g[nr][nc]) { near = true; break; }
    }
    if (near) out[r][c] = 'D';
  }
  return out;
}
function processPixel(art) {
  const base = parseArt(art);
  const R0 = base.length, C0 = base[0].length;
  // 테두리 포함 42x34 안에 꽉 차게 확대 (블록 수를 최대한 많이)
  const s = Math.min((MAX_C - 2) / C0, (MAX_R - 2) / R0);
  const Rn = Math.round(R0 * s), Cn = Math.round(C0 * s);
  const g = [];
  for (let r = 0; r < Rn; r++) {
    g.push([]);
    for (let c = 0; c < Cn; c++) g[r].push(base[Math.min(R0 - 1, Math.floor((r + 0.5) * R0 / Rn))][Math.min(C0 - 1, Math.floor((c + 0.5) * C0 / Cn))]);
  }
  return addOutline(g);
}
function makePainter(g, used) {
  const col = k => { used.add(k); return COLORS[k]; };
  const path = pts => { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); };
  return {
    bg(k) { g.fillStyle = col(k); g.fillRect(-50, -50, 2000, 2000); },
    rect(x, y, w, h, k) { g.fillStyle = col(k); g.fillRect(x, y, w, h); },
    circ(x, y, r, k) { g.fillStyle = col(k); g.beginPath(); g.arc(x, y, r, 0, PI * 2); g.fill(); },
    ell(x, y, rx, ry, k, rot = 0) { g.fillStyle = col(k); g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, PI * 2); g.fill(); },
    poly(pts, k) { g.fillStyle = col(k); path(pts); g.closePath(); g.fill(); },
    line(pts, k, w) { g.strokeStyle = col(k); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; path(pts); g.stroke(); },
    curve(pts, k, w) {
      g.strokeStyle = col(k); g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2, my = (pts[i][1] + pts[i + 1][1]) / 2;
        g.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
      }
      const l = pts[pts.length - 1]; g.lineTo(l[0], l[1]); g.stroke();
    },
    arc(x, y, r, a0, a1, k, w) { g.strokeStyle = col(k); g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.arc(x, y, r, a0, a1); g.stroke(); },
  };
}
function processPaint(def) {
  const S = 4;
  const cv = document.createElement('canvas');
  cv.width = def.w * S; cv.height = def.h * S;
  const g = cv.getContext('2d');
  g.scale(S / 10, S / 10);
  const used = new Set();
  def.draw(makePainter(g, used));
  const data = g.getImageData(0, 0, cv.width, cv.height).data;
  const pal = [...used].map(k => [k, hexRgb(COLORS[k])]);
  const out = [];
  for (let r = 0; r < def.h; r++) {
    out.push([]);
    for (let c = 0; c < def.w; c++) {
      const i = ((r * S + S / 2) * cv.width + (c * S + S / 2)) * 4;
      if (data[i + 3] < 128) { out[r].push(null); continue; }
      let best = null, bd = 1e9;
      for (const [k, [pr, pg, pb]] of pal) {
        const d = (data[i] - pr) ** 2 + (data[i + 1] - pg) ** 2 + (data[i + 2] - pb) ** 2;
        if (d < bd) { bd = d; best = k; }
      }
      out[r].push(best);
    }
  }
  return addOutline(out);
}

// 스테이지 목록: 도트 그림 32개 + 도형 그림 20개
const STAGES = [
  ...PIXEL_ARTS.map(([name, art]) => ({ name, src: { type: 'pixel', art } })),
  ...PAINT_ARTS.map(def => ({ name: def.name, src: { type: 'paint', def } })),
];
STAGES.forEach((st, i) => {
  st.link = i < 3 ? 0 : Math.min(0.5, 0.18 + i * 0.008);
  st.jitter = Math.min(0.35, 0.05 + i * 0.008);
  st.targetAnts = Math.min(30, 14 + Math.floor(i * 0.35));
});
// 자동 테스트에서 막힌 스테이지는 개미 순서를 다른 시드로 다시 만든다 (스테이지 번호-1 : 시드)
const SEED_FIX = { 40: 1, 42: 2 };
function stageGrid(i) {
  const st = STAGES[i];
  if (!st.grid) st.grid = st.src.type === 'pixel' ? processPixel(st.src.art) : processPaint(st.src.def);
  return st.grid;
}

// ================== 규칙 도우미 ==================
function computeOutside(g) {
  const R = g.length, C = g[0].length;
  const o = g.map(r => r.map(() => false));
  const st = [];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
    if ((r === 0 || c === 0 || r === R - 1 || c === C - 1) && !g[r][c] && !o[r][c]) { o[r][c] = true; st.push([r, c]); }
  }
  while (st.length) {
    const [r, c] = st.pop();
    for (const [dr, dc] of D4) {
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= R || nc >= C) continue;
      if (!g[nr][nc] && !o[nr][nc]) { o[nr][nc] = true; st.push([nr, nc]); }
    }
  }
  return o;
}
function isExposed(g, o, r, c) {
  for (const [dr, dc] of D4) {
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nc < 0 || nr >= g.length || nc >= g[0].length) return true;
    if (o[nr][nc]) return true;
  }
  return false;
}

// 스테이지 생성: 바깥부터 벗겨내는 순서로 개미 순서를 만든다
function buildStage(idx) {
  const st = STAGES[idx], rng = mulberry32(idx * 7919 + 101 + (SEED_FIX[idx] || 0) * 1000003);
  const grid = stageGrid(idx).map(r => r.slice());
  const g = grid.map(r => r.slice());
  const order = [];
  for (;;) {
    const o = computeOutside(g);
    const layer = [];
    for (let r = 0; r < g.length; r++) for (let c = 0; c < g[0].length; c++)
      if (g[r][c] && isExposed(g, o, r, c)) layer.push([r, c]);
    if (!layer.length) break;
    shuffle(layer, rng);
    for (const [r, c] of layer) { order.push(g[r][c]); g[r][c] = null; }
  }
  const avg = Math.max(4, order.length / st.targetAnts);
  const remain = {};
  for (const ch of order) remain[ch] = (remain[ch] || 0) + 1;
  const open = {}, seq = [];
  for (const ch of order) {
    if (!open[ch]) {
      let size = Math.max(3, Math.round(avg * (0.6 + rng() * 0.8)));
      if (size > remain[ch]) size = remain[ch];
      if (remain[ch] - size < 3) size = remain[ch];
      const a = { color: ch, total: size, group: null };
      open[ch] = { a, left: size };
      remain[ch] -= size;
      seq.push(a);
    }
    if (--open[ch].left === 0) open[ch] = null;
  }
  for (let i = 0; i < seq.length - 1; i++) {
    if (rng() < st.jitter) { [seq[i], seq[i + 1]] = [seq[i + 1], seq[i]]; i++; }
  }
  const cols = [[], [], []];
  for (let i = 0; i < seq.length; i += 3) {
    const chunk = seq.slice(i, i + 3);
    const perm = shuffle([0, 1, 2], rng);
    chunk.forEach((a, k) => cols[perm[k]].push(a));
  }
  // 사슬: 같은 줄의 이웃한 두 마리만 연결 (교착 없음)
  const nRows = Math.ceil(seq.length / 3);
  for (let r = 1; r < nRows; r++) {
    if (rng() >= st.link) continue;
    const opts = [[0, 1], [1, 2]].filter(p => p.every(c => cols[c][r]));
    if (!opts.length) continue;
    const pick = opts[Math.floor(rng() * opts.length)];
    const grp = { members: pick.map(c => cols[c][r]) };
    grp.members.forEach(a => a.group = grp);
  }
  return { grid, cols };
}

// ================== 레이아웃 ==================
const PIC = { x: 16, y: 74, w: 388, h: 292 };
const HOLE = { x: 210, y: 398 };
const SLOT = { y: 432, h: 88, w: 72, gap: 6, x0: 18 };
const Q = { y: 534, rowH: 66, colW: 112, gap: 15 };
Q.x0 = (W - (3 * Q.colW + 2 * Q.gap)) / 2;
const SPEED = 560;
const colX = c => Q.x0 + c * (Q.colW + Q.gap) + Q.colW / 2;
const qPosY = i => Q.y + 14 + i * Q.rowH + Q.rowH / 2;
const slotCenter = k => ({ x: SLOT.x0 + k * (SLOT.w + SLOT.gap) + SLOT.w / 2, y: SLOT.y + SLOT.h / 2 });

// ================== 도트 스프라이트 ==================
// o 테두리, b 몸, h 밝은 곳, s 어두운 곳, e 흰자, p 눈동자, k 볼터치
const SPR = {
  ant: [
    '.o.........o.',
    '..o.......o..',
    '...ooooooo...',
    '..obbbbbbbo..',
    '.obbbbbbbbbo.',
    '.obpebbbpebo.',
    '.obppbbbppbo.',
    '.okbbbbbbbko.',
    '..obbbbbbbo..',
    'o..ooooooo..o',
    '.o..obbbo..o.',
    '..ooobbbooo..',
    '..oobbbbboo..',
    '.obhbbbbbbso.',
    '.obhbbbbbbso.',
    '..obbbbbbso..',
    '...ooooooo...'],
  beetle0: [
    '.o.....o.',
    '..o...o..',
    '..ooooo..',
    '.obebebo.',
    'o.ooooo.o',
    '.obbobbo.',
    'oohbobsoo',
    '.ohbobso.',
    'oobbobboo',
    '.obbobbo.',
    '..ooooo..'],
  beetle1: [
    '.o.....o.',
    '..o...o..',
    '..ooooo..',
    '.obebebo.',
    '..ooooo..',
    'oobbobboo',
    '.ohbobso.',
    'oohbobsoo',
    '.obbobbo.',
    'oobbobboo',
    '..ooooo..'],
};
const spriteCache = new Map();
function spriteColor(ch, color) {
  const b = COLORS[color];
  switch (ch) {
    case 'o': return color === 'D' ? '#8a8499' : OUTLINE;
    case 'b': return b;
    case 'h': return shade(b, 0.45);
    case 's': return shade(b, -0.3);
    case 'e': return '#ffffff';
    case 'p': return color === 'D' ? '#000000' : OUTLINE;
    case 'k': return '#ff8fb0';
  }
  return null;
}
function getSprite(name, color, dir, px) {
  const key = name + '|' + color + '|' + dir + '|' + px;
  let cv = spriteCache.get(key);
  if (cv) return cv;
  const map = SPR[name], h = map.length, w = map[0].length;
  const ow = dir % 2 ? h : w, oh = dir % 2 ? w : h;
  const P = Math.max(1, Math.round(px * RES));
  cv = document.createElement('canvas');
  cv.width = ow * P; cv.height = oh * P;
  const c2 = cv.getContext('2d');
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = map[r][c];
    if (ch === '.') continue;
    let x, y;
    if (dir === 0) { x = c; y = r; }
    else if (dir === 1) { x = h - 1 - r; y = c; }
    else if (dir === 2) { x = w - 1 - c; y = h - 1 - r; }
    else { x = r; y = w - 1 - c; }
    c2.fillStyle = spriteColor(ch, color);
    c2.fillRect(x * P, y * P, P, P);
  }
  cv.lw = ow * px; cv.lh = oh * px;
  spriteCache.set(key, cv);
  return cv;
}
function drawSprite(name, color, dir, px, cx, cy, alpha = 1) {
  const cv = getSprite(name, color, dir, px);
  if (alpha < 1) ctx.globalAlpha = alpha;
  ctx.drawImage(cv, Math.round(cx - cv.lw / 2), Math.round(cy - cv.lh / 2), cv.lw, cv.lh);
  ctx.globalAlpha = 1;
}
function dirOf(ang) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 1 : 3;
  return dy > 0 ? 2 : 0;
}

// 음식 블록 (도트 입체)
function paintBlock(c2, x, y, w, h, ch) {
  const col = COLORS[ch];
  const u = Math.max(1, Math.round(Math.min(w, h) / 6));
  c2.fillStyle = shade(col, -0.38); c2.fillRect(x, y, w, h);
  c2.fillStyle = shade(col, 0.4); c2.fillRect(x, y, w - u, h - u);
  c2.fillStyle = col; c2.fillRect(x + u, y + u, w - 2 * u, h - 2 * u);
}

// ================== 캐시 레이어 ==================
let layers = {};
const thumbCache = new Map();
function makeLayer(fn) {
  const c = document.createElement('canvas');
  c.width = Math.round(W * RES); c.height = Math.round(H * RES);
  const c2 = c.getContext('2d');
  c2.setTransform(RES, 0, 0, RES, 0, 0);
  c2.imageSmoothingEnabled = false;
  const saved = ctx; ctx = c2;
  try { fn(); } finally { ctx = saved; }
  return c;
}
function layer(name, fn) { return layers[name] || (layers[name] = makeLayer(fn)); }

function cellDev(r, c) {
  const k = game.cs * RES;
  const x0 = Math.round(c * k), y0 = Math.round(r * k), x1 = Math.round((c + 1) * k), y1 = Math.round((r + 1) * k);
  return [x0, y0, x1 - x0, y1 - y0];
}
function buildPicCache() {
  const g = game;
  const cv = document.createElement('canvas');
  cv.width = Math.round(g.C * g.cs * RES); cv.height = Math.round(g.R * g.cs * RES);
  g.pic = cv; g.pctx = cv.getContext('2d');
  for (let r = 0; r < g.R; r++) for (let c = 0; c < g.C; c++) {
    if (!g.grid[r][c]) continue;
    const [x, y, w, h] = cellDev(r, c);
    paintBlock(g.pctx, x, y, w, h, g.grid[r][c]);
  }
}
function clearCell(r, c) { const [x, y, w, h] = cellDev(r, c); game.pctx.clearRect(x, y, w, h); }

function drawThumb(i, x, y, w, h) {
  const g = stageGrid(i);
  const R = g.length, C = g[0].length;
  const cs = Math.min(w / C, h / R);
  const tw = C * cs, th = R * cs;
  const key = i + '|' + w + '|' + h;
  let cv = thumbCache.get(key);
  if (!cv) {
    cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(tw * RES)); cv.height = Math.max(1, Math.round(th * RES));
    const c2 = cv.getContext('2d');
    const kx = cv.width / C, ky = cv.height / R;
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) {
      if (!g[r][c]) continue;
      c2.fillStyle = COLORS[g[r][c]];
      const x0 = Math.round(c * kx), y0 = Math.round(r * ky);
      c2.fillRect(x0, y0, Math.round((c + 1) * kx) - x0, Math.round((r + 1) * ky) - y0);
    }
    thumbCache.set(key, cv);
  }
  ctx.drawImage(cv, Math.round(x + (w - tw) / 2), Math.round(y + (h - th) / 2), Math.round(tw), Math.round(th));
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cvs.style.width = (W * s) + 'px';
  cvs.style.height = (H * s) + 'px';
  cvs.width = Math.round(W * s * dpr);
  cvs.height = Math.round(H * s * dpr);
  RES = s * dpr;
  mainCtx.setTransform(RES, 0, 0, RES, 0, 0);
  mainCtx.imageSmoothingEnabled = false;
  spriteCache.clear(); thumbCache.clear(); layers = {};
  if (game) buildPicCache();
}
window.addEventListener('resize', resize);

// ================== 진행 저장 ==================
const store = (() => {
  try {
    localStorage.setItem('__antTest', '1');
    localStorage.removeItem('__antTest');
    return { persistent: true, get: k => localStorage.getItem(k), set: (k, v) => localStorage.setItem(k, v) };
  } catch (e) {}
  const read = () => { try { return JSON.parse(window.name || '{}') || {}; } catch (e) { return {}; } };
  return {
    persistent: false,
    get: k => (k in read() ? read()[k] : null),
    set: (k, v) => { try { const o = read(); o[k] = v; window.name = JSON.stringify(o); } catch (e) {} }
  };
})();
let cleared = 0, lastStage = 0;
try {
  cleared = parseInt(store.get('antPuzzleCleared') || '0', 10) || 0;
  lastStage = parseInt(store.get('antPuzzleLast') || '0', 10) || 0;
} catch (e) {}
cleared = Math.max(0, Math.min(cleared, STAGES.length));
lastStage = Math.max(0, Math.min(lastStage, cleared, STAGES.length - 1));
function saveProgress() {
  try {
    store.set('antPuzzleCleared', String(cleared));
    store.set('antPuzzleLast', String(lastStage));
  } catch (e) {}
}
function continueIdx() {
  return lastStage < cleared ? Math.min(lastStage + 1, STAGES.length - 1) : lastStage;
}

// ================== 사운드 · 진동 ==================
let ac = null, lastBeep = 0, lastVib = 0;
function beep(f, d, v = 0.05, type = 'square') {
  if (!ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
function melody(notes, gap, v) { notes.forEach((f, i) => setTimeout(() => beep(f, 0.16, v, 'square'), i * gap)); }
function vibrate(ms) {
  if (!navigator.vibrate || time - lastVib < 0.07) return;
  lastVib = time;
  try { navigator.vibrate(ms); } catch (e) {}
}

// ================== 게임 상태 ==================
const PER_PAGE = 12;
let screen = 'menu';
let menuPage = 0;
let overlay = null;
let toastMsg = null;
let btns = [];
let time = 0;

function toast(text) { toastMsg = { text, t: 1.6 }; }

function startStage(idx) {
  const d = buildStage(idx);
  const R = d.grid.length, C = d.grid[0].length;
  const cs = Math.floor(Math.min(PIC.w / C, PIC.h / R, 30));
  let count = 0;
  d.grid.forEach(r => r.forEach(v => { if (v) count++; }));
  game = {
    idx, grid: d.grid, R, C, cs,
    gx: Math.round(W / 2 - C * cs / 2), gy: Math.round(PIC.y + (PIC.h - R * cs) / 2),
    reserved: d.grid.map(r => r.map(() => false)),
    queues: d.cols, slots: [null, null, null, null, null],
    carriers: [], particles: [], remaining: count, total: count,
    endT: 0, stuckT: 0, state: 'play'
  };
  game.outside = computeOutside(game.grid);
  game.queues.forEach((q, c) => q.forEach((a, i) => {
    Object.assign(a, { col: c, dispatched: 0, cool: 0, shake: 0, inSlot: false, slot: -1 });
    a.x = colX(c); a.y = qPosY(i) + 260 + i * 30;
  }));
  buildPicCache();
  screen = 'play';
  overlay = null;
  lastStage = idx; saveProgress();
  if (idx === 0 && cleared === 0) overlay = 'help';
}

const cellCenter = (r, c) => [game.gx + c * game.cs + game.cs / 2, game.gy + r * game.cs + game.cs / 2];

function findTarget(color) {
  const g = game.grid;
  let best = null, bd = 1e9;
  for (let r = 0; r < game.R; r++) for (let c = 0; c < game.C; c++) {
    if (g[r][c] === color && !game.reserved[r][c] && isExposed(g, game.outside, r, c)) {
      const [x, y] = cellCenter(r, c);
      const d = Math.hypot(x - HOLE.x, y - HOLE.y);
      if (d < bd) { bd = d; best = { r, c }; }
    }
  }
  return best;
}

function freeSlots() { const f = []; game.slots.forEach((s, k) => { if (!s) f.push(k); }); return f; }

function tryPick(c, i) {
  const a = game.queues[c][i];
  if (i > 0) { a.shake = 0.4; toast('맨 위에 있는 개미만 고를 수 있어요'); beep(160, 0.1, 0.03); return; }
  const members = a.group ? a.group.members.slice() : [a];
  if (a.group && !members.every(m => game.queues[m.col][0] === m)) {
    members.forEach(m => m.shake = 0.4);
    toast('사슬로 묶인 두 개미가 모두 맨 위에 있어야 해요');
    beep(160, 0.1, 0.03);
    return;
  }
  const free = freeSlots();
  if (free.length < members.length) {
    members.forEach(m => m.shake = 0.4);
    toast(members.length > 1 ? `빈 자리가 ${members.length}칸 필요해요` : '일터에 빈 자리가 없어요');
    beep(160, 0.1, 0.03);
    return;
  }
  members.sort((p, q) => p.col - q.col).forEach((m, k) => {
    game.queues[m.col].shift();
    m.inSlot = true; m.slot = free[k]; m.cool = 0.2;
    game.slots[free[k]] = m;
  });
  beep(520 + members.length * 120, 0.08, 0.04);
}

function canPickAny() {
  const free = freeSlots().length;
  if (!free) return false;
  for (let c = 0; c < 3; c++) {
    const a = game.queues[c][0];
    if (!a) continue;
    if (!a.group) return true;
    const ms = a.group.members;
    if (ms.every(m => game.queues[m.col][0] === m) && free >= ms.length) return true;
  }
  return false;
}
function slotCanWork() { return game.slots.some(s => s && findTarget(s.color)); }

function burst(x, y, color, n, sp = 90) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * PI * 2, v = sp * (0.4 + Math.random() * 0.8);
    game.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, life: 0.4 + Math.random() * 0.3, color, s: 3 });
  }
}

// ================== 업데이트 ==================
function update(dt) {
  time += dt;
  if (toastMsg) { toastMsg.t -= dt; if (toastMsg.t <= 0) toastMsg = null; }
  if (screen !== 'play' || !game) return;

  const k = Math.min(1, dt * 11);
  game.queues.forEach((q, c) => q.forEach((a, i) => { a.tx = colX(c); a.ty = qPosY(i); }));
  game.slots.forEach((a, s) => { if (a) { const p = slotCenter(s); a.tx = p.x; a.ty = p.y; } });
  for (const a of [...game.queues.flat(), ...game.slots.filter(Boolean)]) {
    a.x += (a.tx - a.x) * k; a.y += (a.ty - a.y) * k;
    if (a.shake > 0) a.shake = Math.max(0, a.shake - dt);
  }

  // 일터 개미가 개미굴에서 쇠똥구리를 내보냄
  if (game.state === 'play') {
    game.slots.forEach((a, s) => {
      if (!a || Math.hypot(a.tx - a.x, a.ty - a.y) > 4) return;
      a.cool -= dt;
      if (a.cool > 0) return;
      const t = findTarget(a.color);
      if (!t) return;
      game.reserved[t.r][t.c] = true;
      game.carriers.push({ color: a.color, x: HOLE.x + (Math.random() * 20 - 10), y: HOLE.y, r: t.r, c: t.c,
        state: 'go', walk: Math.random(), ang: -PI / 2, roll: 0 });
      a.dispatched++; a.cool = 0.07;
      if (a.dispatched >= a.total) {          // 다 보냈으면 바로 사라짐
        game.slots[s] = null;
        burst(a.x, a.y, '#ffffff', 10, 70);
        beep(880, 0.06, 0.03);
      }
    });
  }

  for (const cr of game.carriers) {
    const [tx, ty] = cr.state === 'go' ? cellCenter(cr.r, cr.c) : [HOLE.x, HOLE.y];
    const dx = tx - cr.x, dy = ty - cr.y, d = Math.hypot(dx, dy), step = SPEED * dt;
    if (d > 0.01) cr.ang = Math.atan2(dy, dx);
    cr.walk += dt;
    if (cr.state === 'back') cr.roll += Math.min(step, d);
    if (d <= step) {
      cr.x = tx; cr.y = ty;
      if (cr.state === 'go') {
        game.grid[cr.r][cr.c] = null;
        game.reserved[cr.r][cr.c] = false;
        clearCell(cr.r, cr.c);
        game.outside = computeOutside(game.grid);
        game.remaining--;
        cr.state = 'back';
        vibrate(12);
      } else {
        cr.done = true;
        burst(HOLE.x, HOLE.y - 4, COLORS[cr.color], 3);
        if (time - lastBeep > 0.05) { lastBeep = time; beep(1100 + Math.random() * 300, 0.03, 0.015); }
      }
    } else { cr.x += dx / d * step; cr.y += dy / d * step; }
  }
  game.carriers = game.carriers.filter(c => !c.done);

  for (const p of game.particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; }
  game.particles = game.particles.filter(p => p.life > 0);

  if (game.state === 'play') {
    if (game.remaining === 0 && game.carriers.length === 0) {
      game.endT += dt;
      if (game.endT > 0.5) {
        game.state = 'clear'; overlay = 'clear';
        if (game.idx + 1 > cleared) { cleared = game.idx + 1; saveProgress(); }
        melody([523, 659, 784, 1046], 110, 0.05);
        vibrate(60);
      }
    } else {
      const busy = game.carriers.length > 0 ||
        game.slots.some(s => s && Math.hypot(s.tx - s.x, s.ty - s.y) > 4);
      if (!busy && !slotCanWork() && !canPickAny()) {
        game.stuckT += dt;
        if (game.stuckT > 0.9) { game.state = 'fail'; overlay = 'fail'; melody([392, 330, 262], 150, 0.05); }
      } else game.stuckT = 0;
    }
  }
}

// ================== 그리기 도우미 (도트 UI) ==================
function text(t, x, y, size, color, align = 'center', stroke = null) {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  x = Math.round(x); y = Math.round(y);
  if (stroke) {
    ctx.fillStyle = stroke;
    const o = Math.max(1, Math.round(size / 10));
    for (const [dx, dy] of [[-o,0],[o,0],[0,-o],[0,o],[-o,-o],[o,o],[-o,o],[o,-o]]) ctx.fillText(t, x + dx, y + dy);
  }
  ctx.fillStyle = color; ctx.fillText(t, x, y);
}
// 모서리가 깎인 도트 상자
function pxBox(x, y, w, h, fill, border = OUTLINE, u = 3) {
  x = Math.round(x); y = Math.round(y); w = Math.round(w); h = Math.round(h);
  ctx.fillStyle = border;
  ctx.fillRect(x + u, y, w - 2 * u, h);
  ctx.fillRect(x, y + u, w, h - 2 * u);
  ctx.fillStyle = fill;
  ctx.fillRect(x + u, y + u, w - 2 * u, h - 2 * u);
}
function button(x, y, w, h, label, fn, color = '#ffcf4a', tc = '#3a2412', size = 16) {
  pxBox(x, y + 4, w, h, OUTLINE);
  pxBox(x, y, w, h, color);
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(Math.round(x + 6), Math.round(y + 6), Math.round(w - 12), 3);
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(Math.round(x + 3), Math.round(y + h - 6), Math.round(w - 6), 3);
  text(label, x + w / 2, y + h / 2, size, tc);
  btns.push({ x, y, w, h, fn });
}

function drawGround() {
  ctx.fillStyle = '#8fd168'; ctx.fillRect(0, 0, W, 412);
  ctx.fillStyle = '#7cc058';
  for (let i = 0; i < 140; i++) {
    const x = (i * 73) % W, y = (i * 151) % 404;
    ctx.fillRect(x - x % 4, y - y % 4, 4, 4);
  }
  ctx.fillStyle = '#a8e080';
  for (let i = 0; i < 50; i++) {
    const x = (i * 131 + 17) % W, y = (i * 97 + 31) % 404;
    ctx.fillRect(x - x % 4, y - y % 4, 4, 8);
  }
  ctx.fillStyle = '#7a5235'; ctx.fillRect(0, 412, W, H - 412);
  ctx.fillStyle = '#8fd168';
  for (let x = 0; x < W; x += 8) ctx.fillRect(x, 412, 8, (x / 8) % 3 === 0 ? 8 : 4);
  ctx.fillStyle = '#69452b';
  for (let i = 0; i < 90; i++) {
    const x = (i * 97) % W, y = 424 + (i * 53) % 376;
    ctx.fillRect(x - x % 4, y - y % 4, 4 + (i % 2) * 4, 4);
  }
}
function drawPlayStatic() {
  drawGround();
  // 소풍 매트
  pxBox(PIC.x - 6, PIC.y - 8, PIC.w + 12, PIC.h + 14, '#fff3dc', OUTLINE, 4);
  ctx.fillStyle = '#ffe0d8';
  for (let y = PIC.y - 4; y < PIC.y + PIC.h + 2; y += 12)
    for (let x = PIC.x - 2; x < PIC.x + PIC.w + 2; x += 12)
      if (((x - PIC.x) / 12 + (y - PIC.y) / 12) % 2 === 0)
        ctx.fillRect(x, y, Math.min(12, PIC.x + PIC.w + 2 - x), Math.min(12, PIC.y + PIC.h + 2 - y));
  // 개미굴
  ctx.fillStyle = '#5a3a22'; ctx.fillRect(HOLE.x - 48, HOLE.y - 2, 96, 14);
  ctx.fillStyle = '#9a6a40'; ctx.fillRect(HOLE.x - 40, HOLE.y - 8, 80, 12);
  ctx.fillStyle = '#b07c4c'; ctx.fillRect(HOLE.x - 28, HOLE.y - 12, 56, 6);
  ctx.fillStyle = '#1a100a'; ctx.fillRect(HOLE.x - 20, HOLE.y - 6, 40, 12); ctx.fillRect(HOLE.x - 14, HOLE.y - 9, 28, 16);
  // 일터
  pxBox(10, SLOT.y - 6, W - 20, SLOT.h + 12, '#4a3020');
  for (let k = 0; k < 5; k++) pxBox(SLOT.x0 + k * (SLOT.w + SLOT.gap), SLOT.y, SLOT.w, SLOT.h, '#6a4429', '#2b1b10');
  // 대기열
  pxBox(10, Q.y - 4, W - 20, H - Q.y - 4, '#3a2516');
  for (let c = 0; c < 3; c++) {
    const x = Q.x0 + c * (Q.colW + Q.gap);
    pxBox(x, Q.y + 4, Q.colW, H - Q.y - 16, '#2a1a0f', '#1c1108');
    ctx.fillStyle = '#4a3220'; ctx.fillRect(x + 4, Q.y + 8, Q.colW - 8, Q.rowH - 2);
  }
}

// ================== 화면: 메뉴 ==================
function drawMenu() {
  pxBox(30, 14, 360, 84, '#5a3a22');
  text('개미 뷔페', W / 2, 44, 32, '#ffe08a', 'center', OUTLINE);
  text(`음식을 모두 개미굴로 옮겨요! · ${Math.min(cleared, STAGES.length)}/${STAGES.length} 클리어`, W / 2, 80, 12, '#ffffff');
  drawSprite('ant', 'R', 0, 2, 64, 54);
  drawSprite('ant', 'B', 0, 2, 356, 54);
  const ci = continueIdx();
  button(30, 106, 360, 44, `▶ ${cleared > 0 ? '이어하기' : '시작하기'} · ${ci + 1}. ${STAGES[ci].name}`,
    () => startStage(ci), '#ffd34d', '#3a2412', 16);

  const cw = 116, ch = 136, gap = 14, x0 = (W - (3 * cw + 2 * gap)) / 2, y0 = 160;
  const pages = Math.ceil(STAGES.length / PER_PAGE);
  menuPage = Math.max(0, Math.min(pages - 1, menuPage));
  STAGES.forEach((st, i) => {
    if (Math.floor(i / PER_PAGE) !== menuPage) return;
    const j = i % PER_PAGE;
    const cx = x0 + (j % 3) * (cw + gap), cy = y0 + Math.floor(j / 3) * (ch + 12);
    const locked = i > cleared;
    const done = i < cleared;
    pxBox(cx, cy + 4, cw, ch, OUTLINE);
    pxBox(cx, cy, cw, ch, locked ? '#8d7b68' : '#fff6e0');
    if (!locked) {
      drawThumb(i, cx + 12, cy + 10, cw - 24, 86);
      const label = `${i + 1}. ${st.name}`;
      ctx.font = `12px ${FONT}`;
      const fs = ctx.measureText(label).width > cw - 10 ? 10 : 12;
      text(label, cx + cw / 2, cy + 112, fs, '#3a2412');
      if (done) { pxBox(cx + cw - 26, cy + 4, 22, 22, '#5cc45a'); text('✓', cx + cw - 15, cy + 15, 12, '#fff'); }
      btns.push({ x: cx, y: cy, w: cw, h: ch, fn: () => startStage(i) });
    } else {
      // 도트 자물쇠
      const lx = cx + cw / 2, ly = cy + 54;
      ctx.fillStyle = '#5c4a38';
      ctx.fillRect(lx - 10, ly - 22, 4, 14); ctx.fillRect(lx + 6, ly - 22, 4, 14); ctx.fillRect(lx - 10, ly - 24, 20, 4);
      ctx.fillRect(lx - 16, ly - 8, 32, 26);
      ctx.fillStyle = '#ffcf4a'; ctx.fillRect(lx - 3, ly, 6, 10);
      text(`${i + 1}`, cx + cw / 2, cy + 108, 16, '#5c4a38');
    }
  });
  button(W / 2 - 60, H - 64, 120, 44, '게임 방법', () => { overlay = 'help'; }, '#7cc6f2', '#123a52', 16);
  if (menuPage > 0) button(22, H - 64, 64, 44, '◀', () => { menuPage--; }, '#f3e3c3', '#3a2412', 16);
  if (menuPage < pages - 1) button(W - 86, H - 64, 64, 44, '▶', () => { menuPage++; }, '#f3e3c3', '#3a2412', 16);
  text(`${menuPage + 1} / ${pages}`, menuPage > 0 ? 118 : 70, H - 42, 16, '#ffe7a3');
  if (!store.persistent) text('⚠ 이 화면에서는 저장이 안 돼요. 크롬·사파리 등 브라우저로 열어 주세요.', W / 2, 792, 11, '#ffb3a3');
}
function goMenu() {
  screen = 'menu'; overlay = null;
  menuPage = Math.floor(continueIdx() / PER_PAGE);
}

// ================== 화면: 플레이 ==================
function shakeOf(a) { return a.shake > 0 ? Math.round(Math.sin(a.shake * 60) * 5 * (a.shake / 0.4)) : 0; }
function drawPlay() {
  const g = game;
  pxBox(8, 8, W - 16, 58, '#4a3020');
  button(16, 16, 64, 38, '◀ 목록', goMenu, '#f3e3c3', '#3a2412', 12);
  button(W - 80, 16, 64, 38, '다시', () => startStage(g.idx), '#f3e3c3', '#3a2412', 12);
  text(`STAGE ${g.idx + 1} · ${STAGES[g.idx].name}`, W / 2, 28, 16, '#ffffff');
  const pr = 1 - g.remaining / g.total;
  pxBox(108, 40, 204, 16, OUTLINE, OUTLINE, 2);
  ctx.fillStyle = '#ffd34d'; ctx.fillRect(111, 43, Math.round(198 * pr), 10);
  ctx.fillStyle = '#fff3a0'; ctx.fillRect(111, 43, Math.round(198 * pr), 3);

  ctx.drawImage(g.pic, g.gx, g.gy, g.C * g.cs, g.R * g.cs);

  // 빈 일터 칸 점선
  ctx.fillStyle = '#a07a52';
  for (let k = 0; k < 5; k++) {
    if (g.slots[k]) continue;
    const x = SLOT.x0 + k * (SLOT.w + SLOT.gap) + 8, y = SLOT.y + 8, w = SLOT.w - 16, h = SLOT.h - 16;
    for (let t = 0; t < w; t += 8) { ctx.fillRect(x + t, y, 4, 3); ctx.fillRect(x + t, y + h - 3, 4, 3); }
    for (let t = 0; t < h; t += 8) { ctx.fillRect(x, y + t, 3, 4); ctx.fillRect(x + w - 3, y + t, 3, 4); }
  }

  // 대기열
  ctx.save();
  ctx.beginPath(); ctx.rect(10, Q.y - 4, W - 20, H - Q.y - 4); ctx.clip();
  const drawn = new Set();
  g.queues.flat().forEach(a => {
    if (!a.group || drawn.has(a.group)) return;
    drawn.add(a.group);
    const [p, q] = a.group.members.slice().sort((m, n) => m.col - n.col);
    const x1 = p.x + shakeOf(p), y1 = p.y + 2, x2 = q.x + shakeOf(q), y2 = q.y + 2;
    const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(2, Math.floor(len / 8));
    for (let j = 1; j < n; j++) {
      const t = j / n, x = Math.round(x1 + (x2 - x1) * t), y = Math.round(y1 + (y2 - y1) * t);
      ctx.fillStyle = OUTLINE; ctx.fillRect(x - 4, y - 3, 8, 6);
      ctx.fillStyle = j % 2 ? '#d8dde6' : '#9aa2b0'; ctx.fillRect(x - 3, y - 2, 6, 4);
    }
  });
  g.queues.forEach(q => {
    for (let i = q.length - 1; i >= 0; i--) {
      const a = q[i];
      if (a.y > H + 40) continue;
      const x = a.x + shakeOf(a);
      if (i === 0) {
        const on = Math.floor(time * 3) % 2 === 0;
        ctx.fillStyle = on ? '#ffe066' : '#ffb84d';
        const bx = Math.round(x - 30), by = Math.round(a.y - 30), bw = 60, bh = 60;
        for (const [cx, cy, sx, sy] of [[bx,by,1,1],[bx+bw,by,-1,1],[bx,by+bh,1,-1],[bx+bw,by+bh,-1,-1]]) {
          ctx.fillRect(sx > 0 ? cx : cx - 10, sy > 0 ? cy : cy - 3, 10, 3);
          ctx.fillRect(sx > 0 ? cx : cx - 3, sy > 0 ? cy : cy - 10, 3, 10);
        }
      }
      drawSprite('ant', a.color, 0, 3, x, a.y, i === 0 ? 1 : 0.85);
      text(String(a.total), x, a.y + 15, 16, '#ffffff', 'center', OUTLINE);
    }
  });
  ctx.restore();

  // 일터 개미
  g.slots.forEach(a => {
    if (!a) return;
    const bob = Math.floor(time * 6) % 2;
    drawSprite('ant', a.color, 0, 3, a.x + shakeOf(a), a.y - bob);
    text(String(a.total - a.dispatched), a.x, a.y + 15 - bob, 16, '#ffffff', 'center', OUTLINE);
  });

  // 쇠똥구리: 갈 때는 앞으로, 올 때는 뒤로 걸으며 음식을 굴림
  for (const cr of g.carriers) {
    const fr = 'beetle' + (Math.floor(cr.walk * 12) % 2);
    if (cr.state === 'go') {
      drawSprite(fr, cr.color, dirOf(cr.ang), 2, cr.x, cr.y);
    } else {
      const ux = Math.cos(cr.ang), uy = Math.sin(cr.ang);
      drawSprite(fr, cr.color, (dirOf(cr.ang) + 2) % 4, 2, cr.x - ux * 14, cr.y - uy * 14);
      const bx = Math.round(cr.x - 6), by = Math.round(cr.y - 6 - (Math.floor(cr.roll / 5) % 2));
      paintBlock(ctx, bx, by, 12, 12, cr.color);
      const spot = [[2,2],[7,2],[7,7],[2,7]][Math.floor(cr.roll / 7) % 4];
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(bx + spot[0], by + spot[1], 3, 3);
    }
  }
  for (const p of g.particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillStyle = p.color; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

// ================== 오버레이 ==================
function panel(y, h) {
  ctx.fillStyle = 'rgba(20,12,5,.6)'; ctx.fillRect(0, 0, W, H);
  pxBox(28, y + 6, W - 56, h, OUTLINE, OUTLINE, 4);
  pxBox(28, y, W - 56, h, '#fff6e0', OUTLINE, 4);
}
function drawOverlay() {
  if (overlay === 'help') {
    panel(110, 560);
    text('게임 방법', W / 2, 150, 24, '#3a2412');
    const lines = [
      ['b', '위 그림은 음식 블록이에요.'],
      ['a', '아래 3줄의 맨 위 개미를 눌러'],
      ['', '일터(5칸)로 보내요.'],
      ['c', '개미 숫자만큼 쇠똥구리가'],
      ['', '개미굴에서 나와 같은 색 음식을'],
      ['', '바깥쪽부터 굴려 가져와요.'],
      ['', '다 보낸 개미는 바로 자리를 비워요.'],
      ['l', '사슬로 묶인 두 개미는 둘 다'],
      ['', '맨 위에 있어야 같이 올라가요.'],
      ['x', '일터가 꽉 막히면 실패!'],
      ['o', '음식을 다 옮기면 클리어!'],
    ];
    lines.forEach(([ic, t], i) => {
      const y = 200 + i * 34;
      if (ic === 'a') drawSprite('ant', 'R', 0, 1, 62, y);
      else if (ic === 'c') drawSprite('beetle0', 'B', 0, 2, 62, y);
      else if (ic === 'b') paintBlock(ctx, 54, y - 8, 16, 16, 'Y');
      else if (ic === 'l') { ctx.fillStyle = '#9aa2b0'; ctx.fillRect(52, y - 2, 20, 4); }
      else if (ic === 'x') text('✕', 62, y, 16, '#d0453a');
      else if (ic === 'o') text('★', 62, y, 16, '#e0a020');
      text(t, 84, y, 14, '#3a2412', 'left');
    });
    button(W / 2 - 80, 588, 160, 50, '알겠어요!', () => { overlay = null; });
  } else if (overlay === 'clear') {
    const last = game.idx === STAGES.length - 1;
    panel(150, 470);
    text(last ? '모든 스테이지 클리어!' : '스테이지 클리어!', W / 2, 196, 24, '#d0602a');
    text(`냠냠~ '${STAGES[game.idx].name}' 다 먹었어요`, W / 2, 230, 14, '#3a2412');
    pxBox(90, 252, 240, 200, '#ffffff');
    drawThumb(game.idx, 100, 262, 220, 180);
    if (!last) button(W / 2 - 90, 476, 180, 52, '다음 스테이지 ▶', () => startStage(game.idx + 1));
    button(W / 2 - 70, last ? 490 : 542, 140, 44, '목록으로', goMenu, '#e8dcc4', '#3a2412', 16);
  } else if (overlay === 'fail') {
    panel(220, 300);
    text('개미들이 꼼짝 못 해요!', W / 2, 266, 20, '#b33a2a');
    text('일터가 꽉 차서 더 옮길 수 없어요.', W / 2, 300, 14, '#3a2412');
    drawSprite('ant', 'R', Math.floor(time * 2) % 2 ? 0 : 0, 2, W / 2, 352);
    button(W / 2 - 80, 400, 160, 50, '다시 하기', () => startStage(game.idx));
    button(W / 2 - 70, 462, 140, 42, '목록으로', goMenu, '#e8dcc4', '#3a2412', 16);
  }
}

function drawToast() {
  if (!toastMsg) return;
  ctx.font = `14px ${FONT}`;
  const w = Math.min(W - 30, ctx.measureText(toastMsg.text).width + 36);
  ctx.globalAlpha = Math.min(1, toastMsg.t * 3);
  pxBox(W / 2 - w / 2, 488, w, 40, '#2a1a10', OUTLINE, 3);
  text(toastMsg.text, W / 2, 508, 14, '#ffffff');
  ctx.globalAlpha = 1;
}

// ================== 입력 ==================
function toLogical(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) {} }
  else if (ac.state === 'suspended') ac.resume();
  const { x, y } = toLogical(e);
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h + 4) { beep(660, 0.05, 0.03); b.fn(); return; }
  }
  if (overlay || screen !== 'play' || game.state !== 'play') return;
  for (let c = 0; c < 3; c++) {
    const q = game.queues[c];
    for (let i = 0; i < q.length; i++) {
      const a = q[i];
      if (Math.abs(x - a.x) < Q.colW / 2 && Math.abs(y - a.y) < Q.rowH / 2) { tryPick(c, i); return; }
    }
  }
});

// ================== 루프 ==================
resize();
if (document.fonts && document.fonts.load) document.fonts.load(`16px DungGeunMo`).catch(() => {});
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  btns = [];
  ctx.clearRect(0, 0, W, H);
  if (screen === 'menu') {
    ctx.drawImage(layer('ground', drawGround), 0, 0, W, H);
    drawMenu();
  } else {
    ctx.drawImage(layer('play', drawPlayStatic), 0, 0, W, H);
    drawPlay();
  }
  if (overlay) btns = [];
  drawToast();
  drawOverlay();
  requestAnimationFrame(frame);
}
goMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
